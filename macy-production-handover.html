<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MACY Production – Handover Tasks</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>

<style>
.section {
  background: rgba(255,255,255,0.08);
  padding: 22px;
  border-radius: 18px;
  margin-bottom: 25px;
}

.task {
  border: 1px solid rgba(255,255,255,0.15);
  padding: 18px;
  border-radius: 14px;
  margin-bottom: 20px;
}

.task h4 {
  color: #7dd3fc;
  margin-bottom: 10px;
}

img {
  width: 100%;
  border-radius: 12px;
  margin-top: 8px;
}

.photo-time {
  font-size: 12px;
  color: #93c5fd;
  margin-top: 5px;
}

textarea, input {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: none;
  margin-top: 8px;
}

button {
  width: 100%;
  padding: 18px;
  font-size: 18px;
  border-radius: 18px;
  border: none;
  background: linear-gradient(135deg,#22c55e,#16a34a);
  color: white;
  cursor: pointer;
  margin-top: 20px;
}
</style>
</head>

<body>

<div class="container">

<h1 class="page-title">Handover Tasks</h1>
<h3>MACY Production – Handover Resolution</h3>
<div class="small" id="faceStatus">Face verification required</div>

<div id="taskContainer"></div>

<div class="section">
  <h3>Findings / Observations</h3>
  <div class="small">Add one observation per line.</div>
  <div id="findingInputs"></div>
  <button id="addFindingBtn" type="button" style="background:#0ea5e9;margin-top:12px">
    ➕ Add Finding Line
  </button>
  <button id="submitFindingsBtn" type="button" style="background:#38bdf8;margin-top:10px">
    Submit Findings
  </button>
</div>

<button id="releaseBtn" class="hidden sticky-cta" onclick="finalRelease()">
  ✅ Release to Area Lead Verification
</button>
<button id="unlockHelp" class="small" style="opacity:0.2;margin-top:10px;background:none;border:none;color:#94a3b8;cursor:pointer;">
  Help / Unlock
</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/photoUtils.js"></script>
<script src="js/faceUtils.js"></script>
<script src="js/lockUtils.js"></script>
<script src="js/unlockUtils.js"></script>
<script>
const supabase = window.supabaseClient;

const container = document.getElementById("taskContainer");
const releaseBtn = document.getElementById("releaseBtn");

let completed = new Set();
let tasks = [];
let damageTasks = [];
let renderMap = [];
let currentUser = "";

function stampPhoto(input) {
  const time = new Date().toLocaleString();
  input.setAttribute("data-time", time);
  input.nextElementSibling.innerText = "🕒 " + time;
}

async function fetchHandoverTasks() {
  if (!supabase) return [];
  const { data, error } = await supabase
    .from("handover_tasks")
    .select("*")
    .eq("status", "Pending")
    .order("created_at", { ascending: true });
  if (error) {
    alert("Failed to load handover tasks: " + (error.message || "Unknown error"));
    return [];
  }
  return data || [];
}

async function fetchDamageHandovers() {
  if (!supabase) return [];
  const area = localStorage.getItem("selectedArea") || "MACY_PRODUCTION";
  const { data, error } = await supabase
    .from("damage_reports")
    .select("*")
    .eq("area", area)
    .eq("status", "Handover")
    .order("created_at", { ascending: true });
  if (error) {
    alert("Failed to load handover damages: " + (error.message || "Unknown error"));
    return [];
  }
  return data || [];
}

function renderSection(title, items, typeLabel) {
  if (!items.length) return;
  const header = document.createElement("div");
  header.className = "section";
  header.innerHTML = `<h3>${title}</h3>`;
  container.appendChild(header);
  items.forEach((t, index) => {
    const cardIndex = renderMap.length;
    renderMap.push({ type: typeLabel, record: t });
    const div = document.createElement("div");
    div.className = "section task";
    div.innerHTML = `
      <h4>${typeLabel} ${index + 1}</h4>
      <b>Issue:</b>
      <p>${t.task_description || t.description || "—"}</p>
      <b>Source:</b>
      <p>${t.source || "—"}</p>
      <b>Reference:</b>
      <p>${t.reference_id || "—"}</p>
      <hr>
      <label>Sanitation action taken *</label>
      <textarea id="comment-${cardIndex}"
        placeholder="Explain what action was taken"></textarea>
      <label>Capture fix photo *</label>
      <input type="file" accept="image/*" capture="environment"
        onchange="stampPhoto(this)">
      <div class="photo-time"></div>
      <button onclick="completeTask(${cardIndex}, '${typeLabel}', 'Completed')">
        ✔ Mark as Completed
      </button>
      <button onclick="completeTask(${cardIndex}, '${typeLabel}', 'Cannot Complete')" style="background:#f59e0b;">
        ⚠ Cannot Complete
      </button>
    `;
    container.appendChild(div);
  });
  return;
}

async function render() {

  localStorage.setItem("selectedArea", "MACY_PRODUCTION");
  localStorage.setItem("selectedLine", "MACY_PRODUCTION");

  if (!currentUser) {
    const face = await ensureFaceVerified({
      supabase,
      role: "handover",
      area: "MACY_PRODUCTION"
    });
    if (!face.ok) {
      alert(face.reason || "Face verification required.");
      return;
    }
    currentUser = face.name;
    const status = document.getElementById("faceStatus");
    if (status) status.innerText = `Face verified: ${face.name}`;

    attachUnlock({ supabase, area: "MACY_PRODUCTION", task: "handover" });

    const lock = await acquireTaskLock({
      supabase,
      area: "MACY_PRODUCTION",
      task: "handover",
      userName: face.name
    });
    if (!lock.ok) {
      alert(lock.reason || "Handover currently in progress.");
      return;
    }
  }

  tasks = await fetchHandoverTasks();
  damageTasks = await fetchDamageHandovers();

  container.innerHTML = "";
  completed = new Set();
  renderMap = [];

  if (tasks.length === 0 && damageTasks.length === 0) {
    container.innerHTML =
      "<p>No handover tasks found.</p>";
    releaseBtn.classList.remove("hidden");
    return;
  }
  const postCleanTasks = tasks.filter(t => t.source === "post-clean");
  const inspectionTasks = tasks.filter(t => t.source === "area-verification");
  const otherTasks = tasks.filter(t => !t.source || (t.source !== "post-clean" && t.source !== "area-verification"));

  renderSection("Post-Clean Handover Tasks", postCleanTasks, "post-clean");
  renderSection("Area Inspection Findings", inspectionTasks, "area-verification");
  renderSection("Additional Handover Tasks", otherTasks, "handover");
  renderSection("Damage Handovers", damageTasks, "damage");
}

async function completeTask(i, type, statusLabel) {

  const comment =
    document.getElementById(`comment-${i}`).value.trim();

  const input =
    document.querySelectorAll("input[type=file]")[i];

  if (!comment || !input.files.length) {
    alert("Comment and photo required.");
    return;
  }

  const file = input.files[0];
  const photo = await readAndStampImage(file);

  if (type === "post-clean" || type === "area-verification" || type === "handover" || type === "handover-finding") {
    // Audit/webhook safe point: task completion with photo evidence.
    const task = renderMap[i] ? renderMap[i].record : null;
    if (!task) {
      alert("Task not found.");
      return;
    }
    const { error } = await supabase
      .from("handover_tasks")
      .update({
        status: "Completed",
        completed_by: `${currentUser} | ${statusLabel} | ${comment}`,
        completed_photo: photo,
        completed_at: new Date().toISOString()
      })
      .eq("id", task.id);
    if (error) {
      alert("Failed to complete task: " + (error.message || "Unknown error"));
      return;
    }
  }

  if (type === "damage") {
    // Audit/webhook safe point: damage completion with photo evidence.
    const damage = renderMap[i] ? renderMap[i].record : null;
    if (!damage) {
      alert("Damage not found.");
      return;
    }
    const { error } = await supabase
      .from("damage_reports")
      .update({
        status: statusLabel === "Cannot Complete" ? "Handover" : "Closed",
        completed_by: `${currentUser} | ${statusLabel} | ${comment}`,
        completed_photo: photo,
        completed_at: statusLabel === "Cannot Complete" ? null : new Date().toISOString(),
        handover_reason: statusLabel === "Cannot Complete" ? comment : null,
        handover_at: statusLabel === "Cannot Complete" ? new Date().toISOString() : null
      })
      .eq("id", damage.id);
    if (error) {
      alert("Failed to complete damage: " + (error.message || "Unknown error"));
      return;
    }
  }

  completed.add(i);

  alert(`Finding ${i + 1} completed.`);
  render();
}

async function finalRelease() {

  if (!supabase) {
    alert("Supabase client not loaded.");
    return;
  }

  const pendingTasks = await fetchHandoverTasks();
  const pendingDamages = await fetchDamageHandovers();
  if (pendingTasks.length || pendingDamages.length) {
    alert("Handover blocked: pending tasks or damage handovers exist.");
    return;
  }

  await completeTaskLock({
    supabase,
    area: "MACY_PRODUCTION",
    task: "handover",
    userName: currentUser || "Sanitation"
  });

  window.location.href = "macy-production-release.html";
}

render();
</script>
<script>
const findingInputs = document.getElementById("findingInputs");
const addFindingBtn = document.getElementById("addFindingBtn");
const submitFindingsBtn = document.getElementById("submitFindingsBtn");

function addFindingRow() {
  const input = document.createElement("input");
  input.placeholder = "Enter observation / task";
  findingInputs.appendChild(input);
}

addFindingBtn.addEventListener("click", () => addFindingRow());
addFindingRow();

submitFindingsBtn.addEventListener("click", async () => {
  const lines = Array.from(findingInputs.querySelectorAll("input"))
    .map(i => i.value.trim())
    .filter(Boolean);
  if (!lines.length) {
    alert("Add at least one finding.");
    return;
  }
  if (!supabase) {
    alert("Supabase client not loaded.");
    return;
  }
  const payload = lines.map(text => ({
    source: "handover-finding",
    reference_id: null,
    task_description: text,
    status: "Pending",
    created_at: new Date().toISOString()
  }));
  const { error } = await supabase
    .from("handover_tasks")
    .insert(payload);
  if (error) {
    alert("Failed to save findings: " + (error.message || "Unknown error"));
    return;
  }
  findingInputs.innerHTML = "";
  addFindingRow();
  render();
});
</script>
<script src="js/layout.js"></script>

</body>
</html>
