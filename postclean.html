<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MACY – Post Cleaning</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="css/style.css">

<style>
.section{
  background:rgba(255,255,255,.08);
  padding:22px;
  border-radius:18px;
  margin-bottom:25px;
}

select,textarea,input{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:none;
  margin-top:10px;
}

.hidden{display:none;}

.submit-btn{
  width:100%;
  padding:18px;
  font-size:18px;
  border-radius:18px;
  border:none;
  background:linear-gradient(135deg,#00c6ff,#0072ff);
  color:white;
  cursor:pointer;
  margin-top:14px;
}

.damage-card{
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.2);
  padding:18px;
  border-radius:16px;
  margin-bottom:25px;
}

.damage-title{
  font-weight:bold;
  margin-bottom:8px;
  color:#93c5fd;
}

.sub-box{
  margin-top:14px;
  padding:14px;
  border-radius:14px;
  background:rgba(255,255,255,.05);
}
</style>
</head>

<body>

<div class="container">

<h1 class="page-title">MACY – <span id="areaName"></span></h1>
<h3>Post-Cleaning Verification</h3>

<!-- EMPLOYEE -->
<div class="section">
  <label>Employee Name</label>
  <input id="empName">

  <label>Date & Time</label>
  <input id="dateTime" readonly>
</div>

<!-- BAGS -->
<div class="section">
  <label>Bags retrieved *</label>
  <input type="number" id="bagsRetrieved">
</div>

<button class="submit-btn" style="background:#f59e0b"
onclick="openDamagePopup()">
⚠ Review Damage
</button>

<button class="submit-btn" onclick="submitPostClean()">
Submit Post-Cleaning
</button>

</div>

<!-- ================= DAMAGE POPUP ================= -->
<div id="damagePopup"
style="
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.85);
z-index:9999;
overflow:auto;
padding:20px">

<div style="
background:#020617;
border-radius:22px;
padding:24px;
max-width:760px;
margin:auto;
">

<h2 style="text-align:center;margin-bottom:25px">
🛠 Damage Acknowledgement
</h2>

<div id="popupList"></div>

<button class="submit-btn" style="background:#334155"
onclick="closePopup()">Close</button>

</div>
</div>

<script>
window.onload = () => {
  document.getElementById("areaName").innerText =
    localStorage.getItem("selectedArea") || "Area";

  document.getElementById("empName").value =
    localStorage.getItem("macyProdPrecleanEmployee") || "";

  document.getElementById("dateTime").value =
    new Date().toLocaleString();
};

/* ================= DAMAGE ================= */

function openDamagePopup(){

  const list = document.getElementById("popupList");
  list.innerHTML = "";

  const damages = JSON.parse(
    localStorage.getItem("macyDamageReports") || "[]"
  ).filter(d => d.status === "Open");

  if(!damages.length){
    list.innerHTML = "<p>No open damages.</p>";
  }

  damages.forEach(d => {

    list.innerHTML += `
      <div class="damage-card">

        <div class="damage-title">${d.area}</div>
        <div style="opacity:.8">${d.description}</div>

        <label>Action *</label>
        <select onchange="toggleDamage('${d.id}', this.value)">
          <option value="">Select</option>
          <option value="Completed">✅ Completed</option>
          <option value="Handover">🔁 Handover</option>
        </select>

        <div id="comp-${d.id}" class="hidden sub-box">
          <label>Completed by *</label>
          <select id="who-${d.id}">
            <option value="">Select</option>
            <option>Maintenance</option>
            <option>Sanitation</option>
            <option>Production</option>
            <option>Contractor</option>
          </select>

          <label>Completion photo *</label>
          <input type="file" accept="image/*" capture="environment"
          id="photo-${d.id}">
        </div>

        <div id="hand-${d.id}" class="hidden sub-box">
          <label>Handover reason *</label>
          <select id="reason-${d.id}">
            <option value="">Select</option>
            <option>Parts required</option>
            <option>Partially fixed</option>
            <option>Maintenance next shift</option>
          </select>
        </div>

        <button class="submit-btn"
        onclick="saveDamage('${d.id}')">
        Save Damage
        </button>

      </div>
    `;
  });

  document.getElementById("damagePopup").style.display = "block";
}

function toggleDamage(id,val){
  document.getElementById("comp-"+id).classList.add("hidden");
  document.getElementById("hand-"+id).classList.add("hidden");

  if(val==="Completed")
    document.getElementById("comp-"+id).classList.remove("hidden");

  if(val==="Handover")
    document.getElementById("hand-"+id).classList.remove("hidden");
}

function saveDamage(id){

  const data = JSON.parse(localStorage.getItem("macyDamageReports")||"[]");
  const d = data.find(x=>x.id===id);

  if(!d) return;

  const comp = document.getElementById("comp-"+id);
  const hand = document.getElementById("hand-"+id);

  if(!comp.classList.contains("hidden")){
    if(!document.getElementById("who-"+id).value ||
       !document.getElementById("photo-"+id).files.length){
      alert("Completed requires person + photo");
      return;
    }
    d.status="Completed";
  }

  if(!hand.classList.contains("hidden")){
    if(!document.getElementById("reason-"+id).value){
      alert("Select handover reason");
      return;
    }
    d.status="Handover";
  }

  localStorage.setItem("macyDamageReports",JSON.stringify(data));
  openDamagePopup();
}

function closePopup(){
  document.getElementById("damagePopup").style.display="none";
}

/* ================= SUBMIT ================= */

function submitPostClean(){

  if(!document.getElementById("bagsRetrieved").value){
    alert("Enter bags retrieved");
    return;
  }

  const damages = JSON.parse(
    localStorage.getItem("macyDamageReports")||"[]"
  );

  if(damages.some(d=>d.status==="Open")){
    alert("All damages must be completed or handed over");
    return;
  }

  localStorage.setItem("macyProdPostcleanDone","YES");
  localStorage.setItem("macyProdPostcleanTime",
    new Date().toLocaleString());

  alert("✅ Post-cleaning submitted successfully");
  window.location.href="macy-production-control.html";
}
</script>

</body>
</html>
