<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MACY – Post Cleaning</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="css/style.css">

<style>
.section{background:rgba(255,255,255,.08);padding:22px;border-radius:18px;margin-bottom:25px}
.question{margin-bottom:20px}
select,textarea,input{width:100%;padding:11px;border-radius:12px;border:none;margin-top:8px}
.hidden{display:none}
.submit-btn{width:100%;padding:18px;font-size:18px;border-radius:18px;border:none;background:linear-gradient(135deg,#00c6ff,#0072ff);color:white;cursor:pointer}
.warning{background:rgba(250,204,21,.1);border-left:4px solid #facc15;padding:12px;border-radius:12px;font-size:13px;margin-top:10px}
.handover-box{margin-top:10px;padding:12px;border-radius:12px;background:rgba(59,130,246,.08);border-left:4px solid #60a5fa}
</style>
</head>

<body>

<div class="container">

<h1 class="page-title">MACY – <span id="areaName"></span></h1>
<h3>Post-Cleaning Verification</h3>

<!-- EMPLOYEE -->
<div class="section">
  <h3>Employee Information</h3>
  <label>Name *</label>
  <input type="text" id="empName">
  <label>Date & Time</label>
  <input type="text" id="dateTime" readonly>
</div>

<!-- BAGS -->
<div class="section">
  <label>Bags Retrieved *</label>
  <input type="number" id="bagsRetrieved">
</div>

<!-- HANDOVER -->
<div class="section">
  <label>Anything to handover? *</label>
  <select id="handoverSelect" onchange="toggleHandover(this)">
    <option value="">Select</option>
    <option>No</option>
    <option>Yes</option>
  </select>

  <div id="handoverBox" class="hidden handover-box">
    <p style="font-size:13px">Write one task per box</p>
    <input placeholder="Task 1">
    <input placeholder="Task 2">
    <input placeholder="Task 3">
    <input placeholder="Task 4">
    <input placeholder="Task 5">
  </div>
</div>

<button class="submit-btn" style="background:#f59e0b" onclick="openDamagePopup()">
⚠ Review Damage
</button>

<button class="submit-btn" onclick="submitPostClean()">Submit Post-Cleaning</button>

</div>

<!-- DAMAGE POPUP -->
<div id="damagePopup" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:999;padding:20px;overflow:auto">

<div style="background:#020617;border-radius:18px;padding:22px;max-width:750px;margin:auto">
<h3>Damage Acknowledgement</h3>
<div id="popupList"></div>
<button class="submit-btn" onclick="closePopup()">Close</button>
</div>

</div>

<script>
window.onload=()=>{
  document.getElementById("areaName").innerText =
    localStorage.getItem("selectedArea")||"Area";
  document.getElementById("dateTime").value=new Date().toLocaleString();
};

function toggleHandover(sel){
  document.getElementById("handoverBox").classList.toggle("hidden",sel.value!=="Yes");
}

function openDamagePopup(){
  const list=document.getElementById("popupList");
  list.innerHTML="";
  const damages=JSON.parse(localStorage.getItem("macyDamageReports")||"[]").filter(d=>d.status==="Open");

  if(!damages.length){
    list.innerHTML="<p>No open damages.</p>";
  }

  damages.forEach(d=>{
    list.innerHTML+=`
    <div class="section">
      <b>${d.area}</b><br>${d.description}

      <label>Action *</label>
      <select id="action-${d.id}" onchange="toggleAction('${d.id}')">
        <option value="">Select</option>
        <option value="Completed">Completed</option>
        <option value="Handover">Handover</option>
      </select>

      <div id="completed-${d.id}" class="hidden">
        <label>Completed By *</label>
        <select id="who-${d.id}">
          <option value="">Select</option>
          <option>Maintenance</option>
          <option>Sanitation</option>
          <option>Production</option>
          <option>Contractor</option>
        </select>
        <input type="file" accept="image/*" capture="environment" id="photo-${d.id}">
      </div>

      <div id="handover-${d.id}" class="hidden">
        <label>Handover Reason *</label>
        <select id="reason-${d.id}">
          <option value="">Select</option>
          <option>Parts required</option>
          <option>Partially fixed</option>
          <option>Next shift maintenance</option>
        </select>
      </div>

      <button class="submit-btn" onclick="saveDamage('${d.id}')">Save</button>
    </div>`;
  });

  document.getElementById("damagePopup").style.display="block";
}

function toggleAction(id){
  document.getElementById("completed-"+id).classList.add("hidden");
  document.getElementById("handover-"+id).classList.add("hidden");
  const a=document.getElementById("action-"+id).value;
  if(a==="Completed") document.getElementById("completed-"+id).classList.remove("hidden");
  if(a==="Handover") document.getElementById("handover-"+id).classList.remove("hidden");
}

function saveDamage(id){
  const data=JSON.parse(localStorage.getItem("macyDamageReports")||"[]");
  const d=data.find(x=>x.id===id);
  const action=document.getElementById("action-"+id).value;

  if(action==="Completed"){
    const who=document.getElementById("who-"+id).value;
    const file=document.getElementById("photo-"+id).files[0];
    if(!who||!file){alert("Completed requires person and photo");return;}
    const r=new FileReader();
    r.onload=()=>{
      d.status="Completed";
      d.completedBy=who;
      d.completedPhoto=r.result;
      d.completedTime=new Date().toLocaleString();
      localStorage.setItem("macyDamageReports",JSON.stringify(data));
      openDamagePopup();
    };
    r.readAsDataURL(file);
  }

  if(action==="Handover"){
    const reason=document.getElementById("reason-"+id).value;
    if(!reason){alert("Select handover reason");return;}
    d.status="Handover";
    d.handoverReason=reason;
    d.handoverTime=new Date().toLocaleString();
    localStorage.setItem("macyDamageReports",JSON.stringify(data));
    openDamagePopup();
  }
}

function closePopup(){
  document.getElementById("damagePopup").style.display="none";
}

function submitPostClean(){
  const damages=JSON.parse(localStorage.getItem("macyDamageReports")||"[]");
  if(damages.some(d=>d.status==="Open")){
    alert("All damages must be completed or handed over.");
    return;
  }

  localStorage.setItem("macyProdPostcleanDone","YES");
  localStorage.setItem("macyProdPostcleanTime",new Date().toLocaleString());

  alert("✅ Post-cleaning submitted");
  window.location.href="macy-production-control.html";
}
</script>

</body>
</html>
