<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MACY – Post Cleaning</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="css/style.css">

<style>
.section{
  background:rgba(255,255,255,.08);
  padding:22px;
  border-radius:18px;
  margin-bottom:25px;
}

.question{margin-bottom:20px;}

select,textarea,input{
  width:100%;
  padding:11px;
  border-radius:12px;
  border:none;
  margin-top:8px;
}

.hidden{display:none;}

.submit-btn{
  width:100%;
  padding:18px;
  font-size:18px;
  border-radius:18px;
  border:none;
  background:linear-gradient(135deg,#00c6ff,#0072ff);
  color:white;
  cursor:pointer;
}

.popup-box{
  background:#020617;
  border-radius:18px;
  padding:22px;
  max-width:720px;
  margin:auto;
}

.damage-card{
  border:1px solid rgba(255,255,255,.15);
  border-radius:14px;
  padding:16px;
  margin-bottom:18px;
}
</style>
</head>

<body>

<div class="container">

<h1 class="page-title">MACY – <span id="areaName"></span></h1>
<h3>Post-Cleaning Verification</h3>

<!-- EMPLOYEE -->
<div class="section">
  <h3>Employee Information</h3>

  <label>Employee Name *</label>
  <input type="text" id="empName" placeholder="Enter your name">

  <label>Date & Time</label>
  <input type="text" id="dateTime" readonly>
</div>

<!-- BAGS -->
<div class="section">
  <h3>Bag Reconciliation</h3>
  <input type="number" id="bagsRetrieved" placeholder="Enter bags retrieved">
</div>

<!-- HANDOVER -->
<div class="section">
  <h3>Handover Check</h3>

  <select id="handoverSelect" onchange="toggleHandover(this)">
    <option value="">Select</option>
    <option>No</option>
    <option>Yes</option>
  </select>

  <div id="handoverBox" class="hidden">
    <p style="font-size:13px;opacity:.8">
      Write each handover task separately.
    </p>

    <input placeholder="Task 1">
    <input placeholder="Task 2">
    <input placeholder="Task 3">
    <input placeholder="Task 4">
    <input placeholder="Task 5">
  </div>
</div>

<button class="submit-btn"
  style="background:#f59e0b;margin-bottom:15px"
  onclick="openDamagePopup()">
  ⚠ Review Damage
</button>

<button class="submit-btn" onclick="submitPostClean()">
  Submit Post-Cleaning
</button>

</div>

<!-- DAMAGE POPUP -->
<div id="damagePopup"
style="display:none;position:fixed;inset:0;
background:rgba(0,0,0,.85);z-index:999;padding:20px;overflow:auto">

<div class="popup-box">
<h3>Damage Acknowledgement</h3>
<div id="popupList"></div>

<button class="submit-btn" onclick="closePopup()">Close</button>
</div>
</div>

<script>
window.onload=()=>{
  document.getElementById("areaName").innerText =
    localStorage.getItem("selectedArea") || "Area";

  document.getElementById("empName").value =
    localStorage.getItem("macyProdPrecleanEmployee") || "";

  document.getElementById("dateTime").value =
    new Date().toLocaleString();
};

function toggleHandover(sel){
  document.getElementById("handoverBox")
    .classList.toggle("hidden", sel.value!=="Yes");
}

/* DAMAGE POPUP */
function openDamagePopup(){
  const list=document.getElementById("popupList");
  list.innerHTML="";

  const damages=JSON.parse(localStorage.getItem("macyDamageReports")||"[]")
    .filter(d=>d.status==="Open");

  if(!damages.length){
    list.innerHTML="<p>No open damages.</p>";
  }

  damages.forEach(d=>{
    list.innerHTML+=`
      <div class="damage-card">
        <b>${d.area}</b><br>
        ${d.description}

        <label>Action *</label>
        <select onchange="toggleDamage('${d.id}', this.value)">
          <option value="">Select</option>
          <option value="Completed">Completed</option>
          <option value="Handover">Handover</option>
        </select>

        <div id="comp-${d.id}" class="hidden">
          <label>Completed by *</label>
          <select id="who-${d.id}">
            <option value="">Select</option>
            <option>Maintenance</option>
            <option>Sanitation</option>
            <option>Production</option>
            <option>Contractor</option>
          </select>

          <label>Completion photo *</label>
          <input type="file" accept="image/*" capture="environment" id="photo-${d.id}">
        </div>

        <div id="hand-${d.id}" class="hidden">
          <label>Handover reason *</label>
          <select id="reason-${d.id}">
            <option value="">Select</option>
            <option>Parts required</option>
            <option>Partially fixed</option>
            <option>Maintenance next shift</option>
          </select>
        </div>

        <button class="submit-btn"
          style="margin-top:12px"
          onclick="saveDamage('${d.id}')">
          Save
        </button>
      </div>
    `;
  });

  document.getElementById("damagePopup").style.display="block";
}

function toggleDamage(id,val){
  document.getElementById("comp-"+id).classList.add("hidden");
  document.getElementById("hand-"+id).classList.add("hidden");

  if(val==="Completed")
    document.getElementById("comp-"+id).classList.remove("hidden");

  if(val==="Handover")
    document.getElementById("hand-"+id).classList.remove("hidden");
}

function saveDamage(id){
  const data=JSON.parse(localStorage.getItem("macyDamageReports")||"[]");
  const d=data.find(x=>x.id===id);

  const comp=document.getElementById("comp-"+id);
  const hand=document.getElementById("hand-"+id);

  if(!comp.classList.contains("hidden")){
    const who=document.getElementById("who-"+id).value;
    const photo=document.getElementById("photo-"+id).files.length;
    if(!who||!photo){alert("Completed requires person + photo");return;}
    d.status="Completed";
  }

  if(!hand.classList.contains("hidden")){
    const r=document.getElementById("reason-"+id).value;
    if(!r){alert("Select handover reason");return;}
    d.status="Handover";
  }

  localStorage.setItem("macyDamageReports",JSON.stringify(data));
  openDamagePopup();
}

function closePopup(){
  document.getElementById("damagePopup").style.display="none";
}

/* SUBMIT */
function submitPostClean(){
  if(!document.getElementById("bagsRetrieved").value){
    alert("Enter bags retrieved");
    return;
  }

  const damages=JSON.parse(localStorage.getItem("macyDamageReports")||"[]");
  if(damages.some(d=>d.status==="Open")){
    alert("All damages must be acknowledged");
    return;
  }

  localStorage.setItem("macyProdPostcleanDone","YES");
  localStorage.setItem("macyProdPostcleanTime",new Date().toLocaleString());

  alert("✅ Post-cleaning submitted successfully");
  window.location.href="macy-production-control.html";
}
</script>

</body>
</html>
