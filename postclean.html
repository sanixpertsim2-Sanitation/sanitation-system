<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MACY – Post Cleaning</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="css/style.css">

<style>
.section {
  background: rgba(255,255,255,.08);
  border-radius: 18px;
  padding: 22px;
  margin-bottom: 25px;
}

.question { margin-bottom: 18px; }

select, textarea, input {
  width:100%;
  padding:10px;
  border-radius:10px;
  border:none;
  margin-top:6px;
}

.hidden { display:none; }

.submit-btn {
  width:100%;
  padding:18px;
  border:none;
  border-radius:16px;
  font-size:18px;
  background:linear-gradient(135deg,#22c55e,#16a34a);
  color:white;
}
.popup {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:9999;
}
.popup-box {
  background:#020617;
  padding:25px;
  border-radius:18px;
  width:90%;
  max-width:500px;
}
.task {
  margin-bottom:10px;
}
</style>
</head>

<body>

<div class="container">

<h1 class="page-title">Post-Cleaning Verification</h1>

<div class="section">

  <div class="question">
    Conveyor clean and free from residue
    <select onchange="toggle(this)">
      <option value="">Select</option>
      <option>Acceptable</option>
      <option>Not Acceptable</option>
      <option>N/A</option>
    </select>
    <div class="extra hidden">
      <input type="file" capture="environment">
      <textarea placeholder="Comment"></textarea>
    </div>
  </div>

  <div class="question">
    Guards installed correctly
    <select onchange="toggle(this)">
      <option value="">Select</option>
      <option>Acceptable</option>
      <option>Not Acceptable</option>
      <option>N/A</option>
    </select>
    <div class="extra hidden">
      <input type="file" capture="environment">
      <textarea placeholder="Comment"></textarea>
    </div>
  </div>

</div>

<button class="submit-btn" onclick="confirmHandover()">
  Submit Post-Cleaning
</button>

</div>

<!-- HANDOVER POPUP -->
<div class="popup" id="handoverPopup">
  <div class="popup-box">

    <h3>Handover Required?</h3>

    <p style="opacity:.7;margin-bottom:15px">
      Select if any unfinished cleaning or issues
      must be transferred to next shift.
    </p>

    <button class="submit-btn"
      style="background:#16a34a;margin-bottom:10px"
      onclick="noHandover()">
      No Handover Required
    </button>

    <button class="submit-btn"
      style="background:#f59e0b"
      onclick="showTasks()">
      Yes — Add Handover Tasks
    </button>

  </div>
</div>

<!-- TASK POPUP -->
<div class="popup" id="taskPopup">
  <div class="popup-box">

    <h3>Handover Tasks</h3>

    <p style="font-size:13px;opacity:.7">
      Enter one task per box.  
      Do not combine multiple items in one line.
    </p>

    <div id="tasks">
      <input class="task" placeholder="Task 1">
      <input class="task" placeholder="Task 2">
      <input class="task" placeholder="Task 3">
      <input class="task" placeholder="Task 4">
      <input class="task" placeholder="Task 5">
    </div>

    <button class="submit-btn"
      style="margin-top:15px"
      onclick="submitHandover()">
      Submit Handover
    </button>

  </div>
</div>

<script>
function toggle(sel) {
  const extra = sel.parentElement.querySelector(".extra");
  if (sel.value !== "Acceptable")
    extra.classList.remove("hidden");
  else
    extra.classList.add("hidden");
}

function confirmHandover() {
  document.getElementById("handoverPopup").style.display = "flex";
}

function noHandover() {
  localStorage.setItem("macyPostCleanDone","YES");
  localStorage.setItem("macyPostCleanHandover","NO");
  alert("Post-clean completed");
  window.location.href = "control.html";
}

function showTasks() {
  document.getElementById("handoverPopup").style.display = "none";
  document.getElementById("taskPopup").style.display = "flex";
}

function submitHandover() {

  const inputs = document.querySelectorAll(".task");
  const tasks = [];

  inputs.forEach(i => {
    if (i.value.trim()) tasks.push(i.value.trim());
  });

  if (tasks.length === 0) {
    alert("Please enter at least one handover task.");
    return;
  }

  localStorage.setItem("macyPostCleanDone","YES");
  localStorage.setItem("macyPostCleanHandover","YES");
  localStorage.setItem("macyPostCleanTasks", JSON.stringify(tasks));

  alert("Handover submitted successfully");

  window.location.href = "control.html";
}
</script>

</body>
</html>
