<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Post-Cleaning Verification</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="css/style.css">

<style>
.section {
  background: rgba(255,255,255,0.08);
  padding: 22px;
  border-radius: 18px;
  margin-bottom: 25px;
}

.question {
  margin-bottom: 20px;
}

select, textarea, input {
  width: 100%;
  padding: 11px;
  border-radius: 12px;
  border: none;
  margin-top: 8px;
}

.hidden {
  display: none;
}

.submit-btn {
  width: 100%;
  padding: 18px;
  font-size: 18px;
  border-radius: 18px;
  border: none;
  background: linear-gradient(135deg,#00c6ff,#0072ff);
  color: #fff;
  cursor: pointer;
  box-shadow: 0 0 25px rgba(0,180,255,.6);
}

.handover-note {
  margin-top: 10px;
  padding: 12px 14px;
  border-left: 4px solid #facc15;
  background: rgba(250,204,21,0.08);
  color: rgba(255,255,255,.65);
  font-size: 13px;
  font-style: italic;
  border-radius: 10px;
}
</style>
</head>

<body>

<div class="container">

<h1 class="page-title">
  MACY – <span id="areaName">Area</span>
</h1>

<h3>Post-Cleaning Verification</h3>

<!-- ===================== -->
<!-- BAG RECONCILIATION -->
<!-- ===================== -->
<div class="section">

  <h3>Bag Reconciliation</h3>

  <label>Number of bags retrieved *</label>
  <input type="number" id="bagsRetrieved" min="0">

</div>

<!-- ===================== -->
<!-- POST CLEAN QUESTIONS -->
<!-- ===================== -->
<div class="section">

  <h3>Post-Cleaning Verification</h3>

  <div class="question">
    <label>Conveyor cleaned and free from residue *</label>
    <select onchange="handleNA(this)">
      <option value="">Select</option>
      <option>Acceptable</option>
      <option>Not Acceptable</option>
      <option>N/A</option>
    </select>
    <textarea class="hidden" placeholder="Comment required"></textarea>
    <input type="file" class="hidden" accept="image/*" capture="environment">
  </div>

  <div class="question">
    <label>All guards reinstalled correctly *</label>
    <select onchange="handleNA(this)">
      <option value="">Select</option>
      <option>Acceptable</option>
      <option>Not Acceptable</option>
      <option>N/A</option>
    </select>
    <textarea class="hidden" placeholder="Comment required"></textarea>
    <input type="file" class="hidden" accept="image/*" capture="environment">
  </div>

  <div class="question">
    <label>Frames and structure cleaned *</label>
    <select onchange="handleNA(this)">
      <option value="">Select</option>
      <option>Acceptable</option>
      <option>Not Acceptable</option>
      <option>N/A</option>
    </select>
    <textarea class="hidden" placeholder="Comment required"></textarea>
    <input type="file" class="hidden" accept="image/*" capture="environment">
  </div>

</div>

<!-- ===================== -->
<!-- DAMAGE STATUS INFO -->
<!-- ===================== -->
<div class="section" id="damageWarning" style="display:none">
  <h3>⚠️ Damage Status</h3>
  <div class="handover-note">
    Open damage reports exist.<br>
    Please complete or handover all damages before submitting post-cleaning.
  </div>
</div>

<button class="submit-btn" onclick="submitPostCleaning()">
  Submit Post-Cleaning
</button>

</div>

<script>
/* ============================
   TOGGLE COMMENT + CAMERA
============================ */
function handleNA(selectEl) {

  const q = selectEl.closest(".question");
  const textarea = q.querySelector("textarea");
  const file = q.querySelector("input[type='file']");

  if (
    selectEl.value === "Not Acceptable" ||
    selectEl.value === "N/A"
  ) {
    textarea.classList.remove("hidden");
    file.classList.remove("hidden");
  } else {
    textarea.classList.add("hidden");
    file.classList.add("hidden");
    textarea.value = "";
    file.value = "";
  }
}

/* ============================
   DAMAGE STATUS CHECK
============================ */
function hasOpenDamage() {

  const damages =
    JSON.parse(localStorage.getItem("macyDamageReports") || "[]");

  return damages.some(d => d.status === "Open");
}

/* ============================
   SUBMIT POST CLEAN
============================ */
function submitPostCleaning() {

  if (hasOpenDamage()) {
    document.getElementById("damageWarning").style.display = "block";
    alert(
      "⚠️ Open damage reports found.\n\n" +
      "Please mark all damages as Completed or Handover first."
    );
    return;
  }

  const bagsUsed = parseInt(
    localStorage.getItem("macyProdPrecleanBagsUsed") || "0"
  );

  const bagsRetrieved =
    document.getElementById("bagsRetrieved").value;

  if (!bagsRetrieved) {
    alert("Please enter number of bags retrieved.");
    return;
  }

  if (parseInt(bagsRetrieved) !== bagsUsed) {
    alert(
      "❌ Bag count mismatch.\n\n" +
      "All bags must be retrieved."
    );
    return;
  }

  const questions = document.querySelectorAll(".question");

  for (let q of questions) {

    const select = q.querySelector("select");
    const comment = q.querySelector("textarea");
    const photo = q.querySelector("input[type='file']");

    if (!select.value) {
      alert("Please complete all verification checks.");
      return;
    }

    if (
      select.value === "Not Acceptable" ||
      select.value === "N/A"
    ) {
      if (!comment.value.trim() || !photo.files.length) {
        alert("Photo and comment required.");
        return;
      }
    }
  }

  localStorage.setItem("macyProdPostcleanDone", "YES");
  localStorage.setItem(
    "macyProdPostcleanTime",
    new Date().toLocaleString()
  );

  window.location.href = "macy-production-control.html";
}

/* ============================
   LOAD AREA NAME
============================ */
window.onload = function () {

  const area =
    localStorage.getItem("selectedArea") || "Area";

  document.getElementById("areaName").innerText = area;
};
</script>

</body>
</html>
