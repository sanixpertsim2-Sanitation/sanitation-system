<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sanixpert Automated Website Tester</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8fafc;
      color: #1f2937;
      line-height: 1.6;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    
    .header {
      text-align: center;
      margin-bottom: 40px;
      padding: 30px;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: white;
      border-radius: 16px;
    }
    
    .header h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }
    
    .header p {
      font-size: 1.1rem;
      opacity: 0.9;
    }
    
    .test-form {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      margin-bottom: 30px;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #374151;
    }
    
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s;
    }
    
    .form-group input:focus {
      outline: none;
      border-color: #3b82f6;
    }
    
    .form-group input::placeholder {
      color: #9ca3af;
    }
    
    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-right: 10px;
    }
    
    .btn-primary {
      background: #3b82f6;
      color: white;
    }
    
    .btn-primary:hover {
      background: #2563eb;
      transform: translateY(-1px);
    }
    
    .btn-secondary {
      background: #6b7280;
      color: white;
    }
    
    .btn-secondary:hover {
      background: #4b5563;
    }
    
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    
    .progress-container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      margin-bottom: 30px;
      display: none;
    }
    
    .progress-bar {
      width: 100%;
      height: 8px;
      background: #e5e7eb;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 15px;
    }
    
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #1d4ed8);
      width: 0%;
      transition: width 0.3s ease;
    }
    
    .progress-text {
      text-align: center;
      color: #6b7280;
      font-size: 14px;
    }
    
    .results-container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      display: none;
    }
    
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    
    .summary-card {
      text-align: center;
      padding: 20px;
      border-radius: 12px;
      border: 2px solid #e5e7eb;
    }
    
    .summary-card.passed {
      border-color: #10b981;
      background: #ecfdf5;
    }
    
    .summary-card.failed {
      border-color: #ef4444;
      background: #fef2f2;
    }
    
    .summary-card.skipped {
      border-color: #f59e0b;
      background: #fffbeb;
    }
    
    .summary-card h3 {
      font-size: 2rem;
      margin-bottom: 5px;
    }
    
    .summary-card p {
      color: #6b7280;
      font-weight: 500;
    }
    
    .test-details {
      margin-top: 30px;
    }
    
    .test-item {
      padding: 20px;
      margin-bottom: 15px;
      border-radius: 8px;
      border-left: 4px solid #e5e7eb;
    }
    
    .test-item.passed {
      border-left-color: #10b981;
      background: #f0fdf4;
    }
    
    .test-item.failed {
      border-left-color: #ef4444;
      background: #fef2f2;
    }
    
    .test-item.skipped {
      border-left-color: #f59e0b;
      background: #fffbeb;
    }
    
    .test-item h4 {
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .test-status {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
    }
    
    .test-status.passed {
      background: #10b981;
      color: white;
    }
    
    .test-status.failed {
      background: #ef4444;
      color: white;
    }
    
    .test-status.skipped {
      background: #f59e0b;
      color: white;
    }
    
    .test-meta {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 10px;
    }
    
    .test-error {
      color: #ef4444;
      background: #fef2f2;
      padding: 10px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 14px;
      margin-top: 10px;
    }
    
    .test-result {
      background: #f8fafc;
      padding: 15px;
      border-radius: 6px;
      margin-top: 10px;
      font-family: monospace;
      font-size: 14px;
      max-height: 200px;
      overflow-y: auto;
    }
    
    .actions {
      margin-top: 30px;
      text-align: center;
    }
    
    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid #f3f3f3;
      border-top: 3px solid #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .quick-urls {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      margin-bottom: 30px;
    }
    
    .quick-urls h3 {
      margin-bottom: 15px;
      color: #374151;
    }
    
    .url-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    
    .url-btn {
      padding: 8px 16px;
      background: #f3f4f6;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 14px;
    }
    
    .url-btn:hover {
      background: #e5e7eb;
    }
    
    @media (max-width: 768px) {
      .container {
        padding: 10px;
      }
      
      .header h1 {
        font-size: 2rem;
      }
      
      .summary-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      
      .url-buttons {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🧪 Sanixpert Website Tester</h1>
    <p>Automated testing for your deployed Sanixpert system</p>
  </div>

  <div class="quick-urls">
    <h3>🚀 Quick Test URLs</h3>
    <div class="url-buttons">
      <button class="url-btn" onclick="setTestUrl('https://sanixpert.vercel.app')">Vercel Production</button>
      <button class="url-btn" onclick="setTestUrl('https://localhost:3000')">Local Development</button>
      <button class="url-btn" onclick="setTestUrl('https://your-app.vercel.app')">Custom Vercel</button>
      <button class="url-btn" onclick="setTestUrl('https://example.com')">Custom URL</button>
    </div>
  </div>

  <div class="test-form">
    <div class="form-group">
      <label for="testUrl">🌐 Website URL to Test</label>
      <input 
        type="url" 
        id="testUrl" 
        placeholder="https://your-app.vercel.app"
        value="https://sanixpert.vercel.app"
      >
    </div>
    
    <div class="form-group">
      <label for="testOptions">🎯 Test Options</label>
      <div style="display: flex; gap: 15px; flex-wrap: wrap;">
        <label style="display: flex; align-items: center; gap: 5px; font-weight: normal;">
          <input type="checkbox" id="testConnectivity" checked> Connectivity
        </label>
        <label style="display: flex; align-items: center; gap: 5px; font-weight: normal;">
          <input type="checkbox" id="testWorkflows" checked> Workflows
        </label>
        <label style="display: flex; align-items: center; gap: 5px; font-weight: normal;">
          <input type="checkbox" id="testPerformance" checked> Performance
        </label>
        <label style="display: flex; align-items: center; gap: 5px; font-weight: normal;">
          <input type="checkbox" id="testSecurity" checked> Security
        </label>
      </div>
    </div>
    
    <div style="text-align: center;">
      <button class="btn btn-primary" id="startTest" onclick="startTesting()">
        🚀 Start Testing
      </button>
      <button class="btn btn-secondary" onclick="generateSampleReport()">
        📊 Sample Report
      </button>
    </div>
  </div>

  <div class="progress-container" id="progressContainer">
    <h3 style="margin-bottom: 20px; text-align: center;">🔄 Running Tests...</h3>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="progress-text" id="progressText">Initializing...</div>
  </div>

  <div class="results-container" id="resultsContainer">
    <h2 style="margin-bottom: 20px;">📊 Test Results</h2>
    
    <div class="summary-grid" id="summaryGrid">
      <!-- Summary cards will be inserted here -->
    </div>
    
    <div class="test-details" id="testDetails">
      <!-- Test details will be inserted here -->
    </div>
    
    <div class="actions">
      <button class="btn btn-primary" onclick="downloadReport()">
        📥 Download Report
      </button>
      <button class="btn btn-secondary" onclick="shareResults()">
        📤 Share Results
      </button>
      <button class="btn btn-secondary" onclick="runNewTest()">
        🔄 Run New Test
      </button>
    </div>
  </div>
</div>

<script src="js/website-tester.js"></script>

<script>
let currentTester = null;
let currentResults = null;

// Set test URL from quick buttons
function setTestUrl(url) {
  document.getElementById('testUrl').value = url;
}

// Start testing
async function startTesting() {
  const url = document.getElementById('testUrl').value.trim();
  
  if (!url) {
    alert('Please enter a website URL to test');
    return;
  }
  
  if (!isValidUrl(url)) {
    alert('Please enter a valid URL (e.g., https://example.com)');
    return;
  }
  
  // Show progress
  document.getElementById('progressContainer').style.display = 'block';
  document.getElementById('resultsContainer').style.display = 'none';
  document.getElementById('startTest').disabled = true;
  
  // Initialize tester
  currentTester = new WebsiteTester(url);
  
  // Update progress
  updateProgress(0, 'Starting test suite...');
  
  try {
    // Run tests
    currentResults = await currentTester.runFullTestSuite();
    
    // Show results
    displayResults(currentResults);
    
  } catch (error) {
    console.error('Test error:', error);
    updateProgress(100, 'Test failed: ' + error.message);
    
    setTimeout(() => {
      document.getElementById('progressContainer').style.display = 'none';
      document.getElementById('startTest').disabled = false;
    }, 2000);
  }
}

// Validate URL
function isValidUrl(string) {
  try {
    new URL(string);
    return true;
  } catch (_) {
    return false;
  }
}

// Update progress
function updateProgress(percent, text) {
  document.getElementById('progressFill').style.width = percent + '%';
  document.getElementById('progressText').textContent = text;
}

// Display results
function displayResults(results) {
  document.getElementById('progressContainer').style.display = 'none';
  document.getElementById('resultsContainer').style.display = 'block';
  document.getElementById('startTest').disabled = false;
  
  // Update summary
  const summaryGrid = document.getElementById('summaryGrid');
  summaryGrid.innerHTML = `
    <div class="summary-card passed">
      <h3>${results.passed}</h3>
      <p>Passed</p>
    </div>
    <div class="summary-card failed">
      <h3>${results.failed}</h3>
      <p>Failed</p>
    </div>
    <div class="summary-card skipped">
      <h3>${results.skipped}</h3>
      <p>Skipped</p>
    </div>
    <div class="summary-card">
      <h3>${results.successRate}%</h3>
      <p>Success Rate</p>
    </div>
  `;
  
  // Update test details
  const testDetails = document.getElementById('testDetails');
  testDetails.innerHTML = '<h3>Test Details</h3>' + 
    results.details.map(test => `
      <div class="test-item ${test.status}">
        <h4>
          <span class="test-status ${test.status}">${test.status}</span>
          ${test.name}
        </h4>
        <div class="test-meta">
          Duration: ${test.duration}ms
          ${test.attempt ? `| Attempts: ${test.attempt}` : ''}
        </div>
        ${test.error ? `<div class="test-error">${test.error}</div>` : ''}
        ${test.result ? `<div class="test-result">${JSON.stringify(test.result, null, 2)}</div>` : ''}
      </div>
    `).join('');
}

// Generate sample report
function generateSampleReport() {
  const sampleResults = {
    startTime: new Date().toISOString(),
    baseUrl: document.getElementById('testUrl').value || 'https://example.com',
    totalTests: 12,
    passed: 10,
    failed: 2,
    skipped: 0,
    successRate: '83.3',
    duration: 15000,
    details: [
      {
        name: 'testBasicConnectivity',
        status: 'passed',
        duration: 250,
        result: { reachable: true }
      },
      {
        name: 'testHomepageLoad',
        status: 'passed',
        duration: 1200,
        result: { statusCode: 200, hasSanixpertBranding: true }
      },
      {
        name: 'testStaticAssets',
        status: 'failed',
        duration: 500,
        error: 'Asset not found: /js/database-heartbeat.js'
      }
    ]
  };
  
  displayResults(sampleResults);
}

// Download report
function downloadReport() {
  if (!currentResults) {
    alert('No test results to download');
    return;
  }
  
  const html = currentTester.generateHTMLReport(currentResults);
  const blob = new Blob([html], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  
  const a = document.createElement('a');
  a.href = url;
  a.download = `sanixpert-test-report-${new Date().toISOString().split('T')[0]}.html`;
  a.click();
  
  URL.revokeObjectURL(url);
}

// Share results
function shareResults() {
  if (!currentResults) {
    alert('No test results to share');
    return;
  }
  
  const text = `Sanixpert Test Results:\n` +
    `URL: ${currentResults.baseUrl}\n` +
    `Success Rate: ${currentResults.successRate}%\n` +
    `Passed: ${currentResults.passed}/${currentResults.totalTests}\n` +
    `Failed: ${currentResults.failed}/${currentResults.totalTests}`;
  
  if (navigator.share) {
    navigator.share({
      title: 'Sanixpert Test Results',
      text: text
    });
  } else {
    // Copy to clipboard
    navigator.clipboard.writeText(text).then(() => {
      alert('Test results copied to clipboard!');
    });
  }
}

// Run new test
function runNewTest() {
  document.getElementById('resultsContainer').style.display = 'none';
  document.getElementById('testUrl').focus();
}

// Initialize
document.addEventListener('DOMContentLoaded', function() {
  // Add enter key support for URL input
  document.getElementById('testUrl').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
      startTesting();
    }
  });
});
</script>

</body>
</html>
