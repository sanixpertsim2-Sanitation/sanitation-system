<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Select Area</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>

<style>
.area-btn {
  width: 100%;
  padding: 18px;
  margin-top: 15px;
  font-size: 18px;
  border-radius: 14px;
  border: none;
  background: linear-gradient(135deg,#00aaff,#0066ff);
  color: white;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="container">
  <h1 class="page-title">MACY’S LINES</h1>
  <h3>Select Line</h3>

  <button class="area-btn" onclick="selectArea('MACY_PRODUCTION')">Production</button>
  <button class="area-btn" onclick="selectArea('MACY_DECORATION')">Decoration</button>
  <button class="area-btn" disabled>Spiral (Coming Soon — Activation Pending)</button>
  <button class="area-btn" disabled>Labeller (Coming Soon — Activation Pending)</button>
</div>

<script>
function selectArea(area) {
  // UI-state only: track selected line/area for routing + headers.
  localStorage.setItem("selectedLine", area);
  localStorage.setItem("selectedArea", area);

  if (area === "MACY_PRODUCTION") {

    // ✅ CLEAN ENTRY POINT (very important)
    localStorage.removeItem("macyProdReleased");
    localStorage.removeItem("macyProdPostcleanDone");
    localStorage.removeItem("macyProdHandoverDone");

    // DO NOT remove preclean here
    // because if preclean is already done,
    // control page must continue flow

    window.location.href = "macy-production-control.html";

  } else if (area === "MACY_DECORATION") {
    window.location.href = "macy-decoration-control.html";
  } else {
    alert("This area will be activated soon.");
  }
}
</script>
<script>
window.onload = function () {
  // No default line display on selection screen.
};
</script>
<script src="js/layout.js"></script>
</body>
</html>
