<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MACY Production – Area Lead Verification</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="css/style.css">

<style>
.section{
  background:rgba(255,255,255,0.08);
  padding:22px;
  border-radius:18px;
  margin-bottom:25px;
}
.question{margin-bottom:22px;}
select,textarea,input{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:none;
  margin-top:8px;
}
.hidden{display:none;}
canvas{
  width:100%;
  height:180px;
  border:2px dashed #60a5fa;
  border-radius:14px;
  background:#020617;
}
button{
  width:100%;
  padding:18px;
  font-size:18px;
  border-radius:18px;
  border:none;
  margin-top:20px;
  background:linear-gradient(135deg,#22c55e,#16a34a);
  color:white;
}
.warn{background:#f59e0b;}
</style>
</head>

<body>

<div class="container">

<h1 class="page-title">Area Lead Verification</h1>
<h3>Final Line Decision</h3>

<!-- LEAD -->
<div class="section">
<label>Area Lead Name *</label>
<select id="leadName">
  <option value="">Select</option>
  <option>Adarsh</option>
  <option>Prabhdeep</option>
  <option>Arjan</option>
  <option>Karanpreeth</option>
</select>

<label>Signature *</label>
<canvas id="signPad"></canvas>
<button onclick="clearSignature()">Clear Signature</button>
</div>

<!-- QUESTIONS -->

<div class="section question">
<label>1️⃣ Verify all coverings removed *</label>
<select onchange="toggleFinding(this)">
  <option value="">Select</option>
  <option>Yes</option>
  <option>No</option>
</select>
<div class="extra hidden">
  <textarea placeholder="Comment required"></textarea>
</div>
</div>

<div class="section question">
<label>2️⃣ Conveyor verification *</label>
<select onchange="toggleFinding(this)">
  <option value="">Select</option>
  <option>Yes</option>
  <option>No</option>
</select>
<div class="extra hidden">
  <textarea placeholder="Comment required"></textarea>
</div>
</div>

<div class="section question">
<label>3️⃣ Frames & structure *</label>
<select onchange="toggleFinding(this)">
  <option value="">Select</option>
  <option>Excellent</option>
  <option>Moderate Standard</option>
  <option>Not up to the mark</option>
</select>
<div class="extra hidden">
  <textarea placeholder="Comment required"></textarea>
</div>
</div>

<div class="section question">
<label>4️⃣ Floor condition *</label>
<select onchange="toggleFinding(this)">
  <option value="">Select</option>
  <option>Excellent</option>
  <option>Acceptable Standard</option>
  <option>Need Floor Cleaning</option>
</select>
<div class="extra hidden">
  <textarea placeholder="Comment required"></textarea>
</div>
</div>

<button class="warn" onclick="reviewDamages()">🔧 Review Damages</button>
<button class="warn" onclick="goHandover()">📋 Review Handover</button>

<button onclick="submitArea()">Submit</button>

</div>

<script>

/* SIGN */
const canvas=document.getElementById("signPad");
const ctx=canvas.getContext("2d");
let draw=false;
canvas.onmousedown=()=>draw=true;
canvas.onmouseup=()=>{draw=false;ctx.beginPath();};
canvas.onmousemove=e=>{
  if(!draw)return;
  const r=canvas.getBoundingClientRect();
  ctx.lineWidth=2;
  ctx.strokeStyle="#38bdf8";
  ctx.lineTo(e.clientX-r.left,e.clientY-r.top);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(e.clientX-r.left,e.clientY-r.top);
};
function clearSignature(){ctx.clearRect(0,0,canvas.width,canvas.height);}

/* FINDING */
function toggleFinding(sel){
  const bad =
    sel.value==="No" ||
    sel.value==="Not up to the mark" ||
    sel.value==="Need Floor Cleaning";

  sel.parentElement.querySelector(".extra")
    .classList.toggle("hidden",!bad);
}

function reviewDamages(){
  window.location.href="postclean.html";
}
function goHandover(){
  window.location.href="macy-production-handover.html";
}

/* SUBMIT */
function submitArea(){

  const lead=document.getElementById("leadName").value;
  if(!lead) return alert("Select Area Lead");

  const sign=canvas.toDataURL();
  if(sign.length<1000) return alert("Signature required");

  let handovers =
    JSON.parse(localStorage.getItem("macyHandoverTasks")||"[]");

  let newTasks=[];

  document.querySelectorAll(".question").forEach(q=>{
    const txt=q.querySelector("textarea");
    if(txt && txt.value.trim()){
      newTasks.push({
        task: txt.value.trim(),
        status:"Pending",
        source:"Area Verification",
        time:new Date().toLocaleString()
      });
    }
  });

  if(newTasks.length){
    handovers = handovers.concat(newTasks);
    localStorage.setItem("macyHandoverTasks",JSON.stringify(handovers));
    alert("⚠ Sent to Handover");
    window.location.href="macy-production-control.html";
    return;
  }

  const pending =
    handovers.some(h=>h.status!=="Completed");

  if(pending){
    alert("⚠ Pending handovers exist");
    window.location.href="macy-production-control.html";
    return;
  }

  localStorage.setItem("macyProdReleased","YES");
  localStorage.setItem("macyProdReleasedBy",lead);
  localStorage.setItem("macyProdReleaseTime",new Date().toLocaleString());

  alert("✅ LINE RELEASED");
  window.location.href="macy-production-control.html";
}
</script>

</body>
</html>
