<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sanitation Live Control Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="css/style.css">

<style>
body {
  background: radial-gradient(circle at top, #020617, #000);
}

.kpi-row {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
  gap: 18px;
  margin: 25px 0;
}

.kpi {
  background: rgba(255,255,255,0.08);
  padding: 22px;
  border-radius: 20px;
  text-align: center;
  font-size: 18px;
  backdrop-filter: blur(12px);
}

.kpi span {
  display:block;
  font-size:28px;
  font-weight:700;
  margin-top:6px;
}

.green{color:#22c55e;}
.yellow{color:#facc15;}
.red{color:#ef4444;}

.progress-box {
  background: rgba(255,255,255,0.06);
  border-radius: 25px;
  overflow: hidden;
  margin-top: 25px;
}

.progress-bar {
  height: 28px;
  width: 0%;
  background: linear-gradient(90deg,#22c55e,#16a34a);
  transition: width 1s ease;
}

.fullscreen-btn {
  position: fixed;
  bottom: 20px;
  right: 25px;
  padding: 14px 24px;
  border-radius: 20px;
  border:none;
  font-size:16px;
  background:#2563eb;
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<h1 class="page-title">Sanitation Control Dashboard</h1>
<h3>Give & Go Bakery – IM2</h3>

<div class="section-card">
  <h3>Line Overview</h3>
  <div id="lineOverview"></div>
</div>

<div class="section-card">
  <h3>Latest Verified Users</h3>
  <div id="userPhotos"></div>
</div>

<!-- KPI TILES -->
<div class="kpi-row">
  <div class="kpi">Stage<span id="kpiStage">–</span></div>
  <div class="kpi">Open Damages<span id="kpiDamage">0</span></div>
  <div class="kpi">Critical Issues<span id="kpiCritical">0</span></div>
  <div class="kpi">Line Status<span id="kpiRelease">–</span></div>
  <div class="kpi">Time Since Start<span id="kpiTime">–</span></div>
</div>

<!-- GRAPHICAL PROGRESS -->
<div class="progress-box">
  <div class="progress-bar" id="progressBar"></div>
</div>

<!-- FULLSCREEN -->
<button class="fullscreen-btn" onclick="openFull()">📺 Full Screen</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script>
function openFull(){
  document.documentElement.requestFullscreen();
}

const supabase = window.supabaseClient;

async function fetchLatestPreclean(area) {
  if (!supabase) return null;
  const { data, error } = await supabase
    .from("pre_cleaning_logs")
    .select("*")
    .eq("area", area)
    .order("submitted_at", { ascending: false })
    .limit(1);
  if (error) return null;
  return data && data.length ? data[0] : null;
}

async function fetchLatestPostclean(precleanId) {
  if (!supabase || !precleanId) return null;
  const { data, error } = await supabase
    .from("post_cleaning_logs")
    .select("*")
    .eq("preclean_id", precleanId)
    .order("submitted_at", { ascending: false })
    .limit(1);
  if (error) return null;
  return data && data.length ? data[0] : null;
}

async function fetchDamages(area) {
  if (!supabase) return [];
  const { data, error } = await supabase
    .from("damage_reports")
    .select("*")
    .eq("area", area)
    .order("created_at", { ascending: false });
  if (error) return [];
  return data || [];
}

async function fetchLatestRelease() {
  if (!supabase) return null;
  // line_release_logs has no area column; this is the latest global release.
  const { data, error } = await supabase
    .from("line_release_logs")
    .select("*")
    .order("verified_at", { ascending: false })
    .limit(1);
  if (error) return null;
  return data && data.length ? data[0] : null;
}

async function loadDashboard(){

  const area = localStorage.getItem("selectedArea") || "MACY_PRODUCTION";
  const pre = await fetchLatestPreclean(area);
  const post = await fetchLatestPostclean(pre ? pre.id : null);
  const released = await fetchLatestRelease();

  const damages = await fetchDamages(area);
  const openDamages = damages.filter(d => d.status !== "Completed" && d.status !== "Closed");
  const critical = openDamages.filter(d => d.severity === "High");

  let stage = "Not Started";
  let progress = 0;

  if(pre){ stage="Pre-Clean Completed"; progress=20; }
  if(post){ stage="Post-Clean Completed"; progress=40; }
  if(openDamages.length===0 && post){ stage="Damage Clear"; progress=60; }
  if(post && openDamages.length===0){ stage="Awaiting Area Lead"; progress=80; }
  if(released){ stage="Released"; progress=100; }

  document.getElementById("kpiStage").innerText = stage;
  document.getElementById("kpiDamage").innerText = openDamages.length;
  document.getElementById("kpiCritical").innerText = critical.length;
  document.getElementById("kpiRelease").innerText =
    released ? "RELEASED" : "LOCKED";

  if(pre && pre.submitted_at){
    const mins = Math.floor((Date.now() - new Date(pre.submitted_at).getTime()) / 60000);
    document.getElementById("kpiTime").innerText = mins + " min";
  }

  document.getElementById("progressBar").style.width = progress + "%";
}

async function getLineStatus(area) {
  const pre = await fetchLatestPreclean(area);
  const post = await fetchLatestPostclean(pre ? pre.id : null);
  const damages = await fetchDamages(area);
  const openDamages = damages.filter(d => d.status !== "Closed" && d.status !== "Completed");
  const released = await fetchLatestRelease();
  if (released) return "Released";
  if (post) return openDamages.length ? "Post-Clean (Issues)" : "Post-Clean Complete";
  if (pre) return "Pre-Clean Complete";
  return "Not Started";
}

async function loadLineOverview() {
  const lines = [
    { id: "MACY_PRODUCTION", label: "MACY – Production" },
    { id: "MACY_DECORATION", label: "MACY – Decoration" },
    { id: "JFK", label: "JFK – Doughnut (Coming Soon)" },
    { id: "CECE", label: "CECE – Cookies (Coming Soon)" }
  ];
  const container = document.getElementById("lineOverview");
  container.innerHTML = "";
  for (let line of lines) {
    if (line.id === "JFK" || line.id === "CECE") {
      container.innerHTML += `<div>${line.label}</div>`;
      continue;
    }
    const status = await getLineStatus(line.id);
    container.innerHTML += `<div>${line.label}: <b>${status}</b></div>`;
  }
}

async function loadUserPhotos() {
  if (!supabase) return;
  const { data, error } = await supabase
    .from("face_registry")
    .select("*")
    .order("last_seen_at", { ascending: false })
    .limit(6);
  if (error) return;
  const container = document.getElementById("userPhotos");
  container.innerHTML = "";
  (data || []).forEach(u => {
    container.innerHTML += `
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
        <img src="${u.photo}" alt="${u.name}" style="width:48px;height:48px;border-radius:8px;object-fit:cover;">
        <div>
          <div>${u.name}</div>
          <div class="small">${u.role}</div>
        </div>
      </div>
    `;
  });
}

loadDashboard();
loadLineOverview();
loadUserPhotos();
setInterval(loadDashboard, 5000);
setInterval(loadLineOverview, 15000);
setInterval(loadUserPhotos, 20000);
</script>
<script src="js/layout.js"></script>

</body>
</html>
