<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MACY – Area Inspection</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="css/style.css">

<style>
.section {
  background: rgba(255,255,255,0.08);
  padding:22px;
  border-radius:18px;
  margin-bottom:22px;
}

.question {
  margin-bottom:18px;
}

select, textarea, input {
  width:100%;
  padding:11px;
  border-radius:12px;
  border:none;
  margin-top:8px;
}

.hidden { display:none; }

.submit-btn {
  width:100%;
  padding:18px;
  font-size:18px;
  border-radius:18px;
  border:none;
  background:linear-gradient(135deg,#22c55e,#16a34a);
  color:white;
}
</style>
</head>

<body>

<div class="container">

<h1 class="page-title">MACY – Area Inspection</h1>
<h3>Lead / QA Verification</h3>

<div class="section">
  <label>Inspector Name *</label>
  <input type="text" id="inspector">
</div>

<div class="section">

  <div class="question">
    Area visually clean and acceptable *
    <select onchange="toggle(this)">
      <option value="">Select</option>
      <option>Acceptable</option>
      <option>Not Acceptable</option>
    </select>
    <textarea class="hidden" placeholder="Comment required"></textarea>
    <input type="file" class="hidden" accept="image/*" capture="environment">
  </div>

  <div class="question">
    No foreign material observed *
    <select onchange="toggle(this)">
      <option value="">Select</option>
      <option>Acceptable</option>
      <option>Not Acceptable</option>
    </select>
    <textarea class="hidden"></textarea>
    <input type="file" class="hidden" accept="image/*" capture="environment">
  </div>

  <div class="question">
    All guards installed and secured *
    <select onchange="toggle(this)">
      <option value="">Select</option>
      <option>Acceptable</option>
      <option>Not Acceptable</option>
    </select>
    <textarea class="hidden"></textarea>
    <input type="file" class="hidden" accept="image/*" capture="environment">
  </div>

  <div class="question">
    Equipment safe for startup *
    <select onchange="toggle(this)">
      <option value="">Select</option>
      <option>Acceptable</option>
      <option>Not Acceptable</option>
    </select>
    <textarea class="hidden"></textarea>
    <input type="file" class="hidden" accept="image/*" capture="environment">
  </div>

  <div class="question">
    Area approved for production *
    <select onchange="toggle(this)">
      <option value="">Select</option>
      <option>Acceptable</option>
      <option>Not Acceptable</option>
    </select>
    <textarea class="hidden"></textarea>
    <input type="file" class="hidden" accept="image/*" capture="environment">
  </div>

</div>

<button class="submit-btn" onclick="submitInspection()">
  Submit Inspection
</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script>
const supabase = window.supabaseClient;

function updateInspectionButton() {
  const btn = document.querySelector("button[onclick='submitInspection()']");
  if (!btn) return;
  const name = document.getElementById("inspector").value.trim();
  const allAnswered = Array.from(document.querySelectorAll(".question select"))
    .every(sel => sel.value && sel.value.length > 0);
  btn.disabled = !(name && allAnswered);
}

function toggle(sel) {
  const q = sel.parentElement;
  const t = q.querySelector("textarea");
  const f = q.querySelector("input[type=file]");

  if (sel.value === "Not Acceptable") {
    t.classList.remove("hidden");
    f.classList.remove("hidden");
  } else {
    t.classList.add("hidden");
    f.classList.add("hidden");
    t.value = "";
    f.value = "";
  }
  updateInspectionButton();
}

async function submitInspection() {

  const name = document.getElementById("inspector").value.trim();
  if (!name) {
    alert("Inspector name required");
    return;
  }

  const questions = document.querySelectorAll(".question");
  const checklist = [];
  let comments = [];

  for (let q of questions) {
    const sel = q.querySelector("select");
    const txt = q.querySelector("textarea");
    const file = q.querySelector("input[type=file]");

    if (!sel.value) {
      alert("Complete all inspection items");
      return;
    }

    if (sel.value === "Not Acceptable") {
      if (!txt.value.trim() || !file.files.length) {
        alert("Photo and comment required");
        return;
      }
    }

    const photo = await new Promise(resolve => {
      if (!file || !file.files.length) return resolve("");
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result || "");
      reader.readAsDataURL(file.files[0]);
    });

    const questionText = q.childNodes[0].textContent.trim();
    checklist.push({
      question: questionText,
      answer: sel.value,
      comment: txt.value || "",
      photo: photo
    });

    if (txt.value.trim()) {
      comments.push(txt.value.trim());
    }
  }

  if (!supabase) {
    alert("Supabase client not loaded.");
    return;
  }

  const { error } = await supabase
    .from("area_inspection_logs")
    .insert({
      inspector_name: name,
      checklist: checklist,
      comments: comments.join(" | "),
      submitted_at: new Date().toISOString()
    });

  if (error) {
    alert("Failed to save inspection: " + (error.message || "Unknown error"));
    return;
  }

  alert("✅ Area Inspection Completed");

  window.location.href = "control.html";
}
</script>

<script>
document.getElementById("inspector")
  .addEventListener("input", updateInspectionButton);
document.querySelectorAll(".question select")
  .forEach(sel => sel.addEventListener("change", updateInspectionButton));
updateInspectionButton();
</script>

<script src="js/layout.js"></script>
</body>
</html>
