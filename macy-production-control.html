<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MACY – Production Control</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="css/style.css">

<style>
.status {
  padding: 22px;
  border-radius: 18px;
  margin-bottom: 20px;
  text-align: center;
  font-size: 17px;
  font-weight: bold;
}

.blue   { background:#1e3a8a; }
.yellow { background:#92400e; }
.orange { background:#9a3412; }
.green  { background:#065f46; }

.action-btn {
  width: 100%;
  padding: 16px;
  font-size: 17px;
  border-radius: 16px;
  border: none;
  margin-top: 15px;
  background: linear-gradient(135deg,#00aaff,#0066ff);
  color: white;
  cursor: pointer;
}

.unlock-box {
  margin-top: 18px;
  padding: 18px;
  border-radius: 14px;
  border: 1px dashed rgba(255,255,255,.3);
  background: rgba(255,255,255,.04);
}

.pin-input {
  width: 100%;
  font-size: 26px;
  letter-spacing: 12px;
  text-align: center;
  padding: 14px;
  border-radius: 12px;
  border: none;
}
</style>
</head>

<body>

<div class="container">

<h1 class="page-title">MACY – Production Line</h1>
<h3>Sanitation Control Panel</h3>

<div id="statusBox"></div>
<div id="actionBox"></div>

</div>

<script>
const ADMIN_PIN = "0735";

/* ===============================
   NAVIGATION
=============================== */
function goPre()     { location.href = "macy-production-preclean.html"; }
function goDamage()  { location.href = "damage.html"; }
function goPost()    { location.href = "postclean.html"; }
function goRelease() { location.href = "macy-production-release.html"; }

/* ===============================
   RENDER CONTROL
=============================== */
function renderControl() {

  const pre  = localStorage.getItem("macyProdPrecleanDone");
  const post = localStorage.getItem("macyProdPostcleanDone");
  const rel  = localStorage.getItem("macyProdReleased");

  const status = document.getElementById("statusBox");
  const action = document.getElementById("actionBox");

  status.innerHTML = "";
  action.innerHTML = "";

  // 🟢 RELEASED
  if (rel === "YES") {
    status.innerHTML = `<div class="status green">🟢 LINE RELEASED</div>`;
    return;
  }

  // 🟠 POST CLEAN
  if (post === "YES") {
    status.innerHTML = `<div class="status orange">🟠 Post-clean completed</div>`;
    action.innerHTML = `
      <button class="action-btn" onclick="goRelease()">
        Area Lead Verification
      </button>`;
    return;
  }

  // 🔒 PRE CLEAN LOCKED
  if (pre === "YES") {

    status.innerHTML = `
      <div class="status yellow">
        🔒 Pre-Cleaning Locked
      </div>`;

    action.innerHTML = `
      <div class="unlock-box">
        <div style="margin-bottom:10px;font-size:14px;opacity:.7">
          Supervisor unlock required
        </div>

        <input
          id="pinBox"
          class="pin-input"
          type="password"
          maxlength="4"
          inputmode="numeric"
          placeholder="••••"
          oninput="checkPin(this)"
        >
      </div>
    `;
    return;
  }

  // 🔵 NOT STARTED
  status.innerHTML = `<div class="status blue">🔵 Sanitation not started</div>`;
  action.innerHTML = `
    <button class="action-btn" onclick="goPre()">
      Start Pre-Cleaning
    </button>`;
}

/* ===============================
   AUTO PIN CHECK
=============================== */
function checkPin(input) {

  if (input.value.length < 4) return;

  if (input.value === ADMIN_PIN) {

    localStorage.removeItem("macyProdPrecleanDone");
    localStorage.removeItem("macyProdPrecleanTimestamp");

    renderControl();

  } else {
    input.value = "";
    alert("Incorrect PIN");
  }
}

/* ===============================
   START
=============================== */
renderControl();
</script>

</body>
</html>
