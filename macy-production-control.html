<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MACY – Production Control</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="css/style.css">

<style>
.status {
  padding: 22px;
  border-radius: 18px;
  margin-bottom: 20px;
  text-align: center;
  font-size: 17px;
  font-weight: bold;
}

.blue   { background:#1e3a8a; }
.yellow { background:#92400e; }
.orange { background:#9a3412; }
.green  { background:#065f46; }

.action-btn {
  width: 100%;
  padding: 16px;
  font-size: 17px;
  border-radius: 16px;
  border: none;
  margin-top: 15px;
  background: linear-gradient(135deg,#00aaff,#0066ff);
  color: white;
  cursor: pointer;
}

.lock-btn {
  background:#1e293b !important;
}
</style>
</head>

<body>

<div class="container">

<h1 class="page-title">MACY – Production Line</h1>
<h3>Sanitation Control Panel</h3>

<div id="statusBox"></div>
<div id="actionBox"></div>

</div>

<script>
const ADMIN_PIN = "0735";

/* ======================
   NAVIGATION
====================== */
function goPre() {
  window.location.href = "macy-production-preclean.html";
}

function goPost() {
  window.location.href = "postclean.html";
}

function goDamage() {
  window.location.href = "damage.html";
}

function goHandover() {
  window.location.href = "macy-production-handover.html";
}

function goInspection() {
  const pin = prompt("🔐 Area Inspection Access\n\nEnter PIN");

  if (pin === ADMIN_PIN) {
    window.location.href = "macy-area-inspection.html";
  } else {
    alert("❌ Incorrect PIN");
  }
}

/* =============================
   RENDER CONTROL PANEL
============================= */
function renderControl() {

  const preDone  = localStorage.getItem("macyProdPrecleanDone");
  const postDone = localStorage.getItem("macyProdPostcleanDone");
  const released = localStorage.getItem("macyProdReleased");

  const status = document.getElementById("statusBox");
  const action = document.getElementById("actionBox");

  status.innerHTML = "";
  action.innerHTML = "";

  /* ==========================
     🟢 LINE RELEASED
  ========================== */
  if (released === "YES") {
    status.innerHTML =
      `<div class="status green">
        🟢 LINE RELEASED
      </div>`;
    return;
  }

  /* ==========================
     🟠 POST CLEAN DONE
     ONLY HANDOVER + INSPECTION
  ========================== */
  if (postDone === "YES") {

    status.innerHTML =
      `<div class="status orange">
        🟠 Post-Cleaning Completed
      </div>`;

    action.innerHTML = `
      <button class="action-btn" onclick="goHandover()">
        📋 Handover
      </button>

      <button class="action-btn lock-btn" onclick="goInspection()">
        🔒 Area Inspection (Aryaa)
      </button>
    `;
    return;
  }

  /* ==========================
     🟡 PRE CLEAN DONE
  ========================== */
  if (preDone === "YES") {

    status.innerHTML =
      `<div class="status yellow">
        🟡 Pre-Cleaning Completed
      </div>`;

    action.innerHTML = `
      <button class="action-btn" onclick="goDamage()">
        Damage Report
      </button>

      <button class="action-btn" onclick="goPost()">
        Start Post-Cleaning
      </button>

      <div style="
        margin-top:25px;
        padding:18px;
        border:1px dashed rgba(255,255,255,.3);
        border-radius:14px;
        background:rgba(255,255,255,.04);
      ">
        <div style="font-size:14px;opacity:.7;margin-bottom:8px">
          🔐 Admin Unlock Pre-Cleaning
        </div>

        <input
          id="adminPin"
          type="password"
          maxlength="4"
          inputmode="numeric"
          placeholder="••••"
          style="
            width:100%;
            padding:14px;
            font-size:24px;
            text-align:center;
            letter-spacing:10px;
            border-radius:12px;
            border:none;
          "
          oninput="checkAdminPin(this)"
        >
      </div>
    `;
    return;
  }

  /* ==========================
     🔵 FIRST TIME
  ========================== */
  status.innerHTML =
    `<div class="status blue">
      🔵 Sanitation not started
    </div>`;

  action.innerHTML =
    `<button class="action-btn" onclick="goPre()">
      Start Pre-Cleaning
    </button>`;
}

/* =============================
   ADMIN PIN CHECK
============================= */
function checkAdminPin(input) {

  if (input.value.length < 4) return;

  if (input.value === ADMIN_PIN) {

    localStorage.removeItem("macyProdPrecleanDone");

    window.location.href =
      "macy-production-preclean.html";

  } else {
    input.value = "";
    alert("❌ Incorrect PIN");
  }
}

renderControl();
</script>

</body>
</html>
