<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MACY – Sanitation Control Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="css/style.css">

<style>
.status {
  padding: 22px;
  border-radius: 18px;
  margin-bottom: 25px;
  text-align: center;
  font-size: 16px;
  font-weight: bold;
}

.blue { background:#1e3a8a; }
.yellow { background:#92400e; }
.orange { background:#9a3412; }
.green { background:#065f46; }

.action-btn {
  width: 100%;
  padding: 18px;
  font-size: 17px;
  border-radius: 16px;
  border: none;
  margin-top: 15px;
  background: linear-gradient(135deg,#00aaff,#0066ff);
  color: white;
  cursor: pointer;
}

.lock-btn {
  width: 100%;
  padding: 14px;
  margin-top: 20px;
  border-radius: 14px;
  border:1px solid rgba(255,255,255,.3);
  background: transparent;
  color: rgba(255,255,255,.5);
  font-size: 13px;
  opacity: .35;
}
</style>
</head>

<body>

<div class="container">

<h1 class="page-title">MACY – Production Line</h1>
<h3>Sanitation Control Panel</h3>

<div id="statusBox"></div>
<div id="actionBox"></div>

<button class="lock-btn" onclick="adminUnlock()">
  🔐 Admin Unlock Pre-Cleaning
</button>

</div>

<script>
const ADMIN_PIN = "0735";

/* NAVIGATION */
function go(page) {
  window.location.href = page;
}

/* ADMIN UNLOCK */
function adminUnlock() {

  let pin = prompt("Enter 4-digit Admin PIN");

  if (!pin) return;

  if (pin === ADMIN_PIN) {

    localStorage.removeItem("macyPrecleanDone");

    alert("✅ Pre-cleaning unlocked");

    renderControl();

  } else {
    alert("❌ Incorrect PIN");
  }
}

/* RENDER CONTROL LOGIC */
function renderControl() {

  const pre = localStorage.getItem("macyPrecleanDone");
  const post = localStorage.getItem("macyPostcleanDone");
  const hand = localStorage.getItem("macyHandoverDone");
  const insp = localStorage.getItem("macyInspectionDone");
  const rel = localStorage.getItem("macyReleased");

  const status = document.getElementById("statusBox");
  const action = document.getElementById("actionBox");

  status.innerHTML = "";
  action.innerHTML = "";

  /* RELEASED */
  if (rel === "YES") {
    status.innerHTML =
      `<div class="status green">🟢 LINE RELEASED</div>`;
    return;
  }

  /* INSPECTION DONE */
  if (insp === "YES") {
    status.innerHTML =
      `<div class="status green">✅ Area Inspection Completed</div>`;
    action.innerHTML =
      `<button class="action-btn" onclick="go('release.html')">
        Release Line
      </button>`;
    return;
  }

  /* POST CLEAN DONE */
  if (post === "YES") {
    status.innerHTML =
      `<div class="status orange">🟠 Post-clean completed</div>`;
    action.innerHTML = `
      <button class="action-btn" onclick="go('handover.html')">
        Handover
      </button>
      <button class="action-btn" onclick="go('inspection.html')">
        Area Inspection
      </button>`;
    return;
  }

  /* PRE CLEAN DONE */
  if (pre === "YES") {
    status.innerHTML =
      `<div class="status yellow">🟡 Pre-clean completed</div>`;
    action.innerHTML = `
      <button class="action-btn" onclick="go('damage.html')">
        Damage Report
      </button>
      <button class="action-btn" onclick="go('postclean.html')">
        Start Post-Cleaning
      </button>`;
    return;
  }

  /* NOT STARTED */
  status.innerHTML =
    `<div class="status blue">🔵 Sanitation not started</div>`;

  action.innerHTML =
    `<button class="action-btn" onclick="go('preclean.html')">
      Start Pre-Cleaning
    </button>`;
}

renderControl();
</script>

</body>
</html>
