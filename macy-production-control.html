<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MACY – Sanitation Control</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="css/style.css">

<style>
.status {
  padding:22px;
  border-radius:18px;
  margin-bottom:22px;
  text-align:center;
  font-size:16px;
  font-weight:600;
}
.blue {background:#1e3a8a;}
.yellow {background:#92400e;}
.orange {background:#9a3412;}
.red {background:#7c2d12;}
.green {background:#065f46;}

.btn {
  width:100%;
  padding:18px;
  font-size:17px;
  border:none;
  border-radius:16px;
  margin-top:14px;
  background:linear-gradient(135deg,#00aaff,#0066ff);
  color:white;
}
</style>
</head>

<body>

<div class="container">

<h1 class="page-title">MACY – Production Line</h1>
<h3>Sanitation Control Panel</h3>

<div id="statusBox"></div>
<div id="actionBox"></div>

</div>

<script>
function go(p){ window.location.href = p; }

function render() {

  const pre  = localStorage.getItem("macyPreDone");
  const post = localStorage.getItem("macyPostDone");
  const hand = localStorage.getItem("macyPostHandover");
  const insp = localStorage.getItem("macyInspectionDone");
  const rel  = localStorage.getItem("macyReleased");

  const status = document.getElementById("statusBox");
  const action = document.getElementById("actionBox");

  status.innerHTML = "";
  action.innerHTML = "";

  /* ✅ RELEASED */
  if (rel === "YES") {
    status.innerHTML = `<div class="status green">✅ LINE RELEASED</div>`;
    return;
  }

  /* 🟢 READY FOR RELEASE */
  if (insp === "YES") {
    status.innerHTML = `<div class="status green">🟢 Inspection Completed</div>`;
    action.innerHTML = `
      <button class="btn" onclick="go('release.html')">
        Release Line
      </button>`;
    return;
  }

  /* 🔴 HANDOVER */
  if (post === "YES" && hand === "YES") {
    status.innerHTML = `<div class="status red">🔴 Handover Pending</div>`;
    action.innerHTML = `
      <button class="btn" onclick="go('handover-view.html')">
        View Handover Tasks
      </button>`;
    return;
  }

  /* 🟠 POST CLEAN DONE */
  if (post === "YES") {
    status.innerHTML = `<div class="status orange">🟠 Awaiting Area Inspection</div>`;
    action.innerHTML = `
      <button class="btn" onclick="go('inspection.html')">
        Area Inspection
      </button>`;
    return;
  }

  /* 🟡 PRE CLEAN DONE */
  if (pre === "YES") {
    status.innerHTML = `<div class="status yellow">🟡 Pre-Cleaning Completed</div>`;
    action.innerHTML = `
      <button class="btn" onclick="go('damage.html')">Damage Report</button>
      <button class="btn" onclick="go('postclean.html')">Post-Cleaning</button>`;
    return;
  }

  /* 🔵 NOT STARTED */
  status.innerHTML = `<div class="status blue">🔵 Sanitation Not Started</div>`;
  action.innerHTML = `
    <button class="btn" onclick="go('macy-production-preclean.html')">
      Start Pre-Cleaning
    </button>`;
}

render();
</script>

</body>
</html>
