<!DOCTYPE html>
<html>
<head>
  <title>Sanitation Verification Report</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container">

  <h1>Sanitation Verification Report</h1>
  <h3 class="page-title">
  MACY – <span id="areaName">Area</span>
</h3>

  <hr>

  <div id="reportContent"></div>

  <button onclick="window.print()" class="primary-btn">
    🖨️ Print / Save PDF
  </button>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script>
const supabase = window.supabaseClient;

function fromStoredDescription(stored) {
  try {
    const parsed = JSON.parse(stored);
    if (parsed && typeof parsed === "object" && "text" in parsed) {
      return parsed.text || "";
    }
  } catch (e) {
    // keep fallback
  }
  return stored || "";
}

async function fetchLatestPreclean(area) {
  if (!supabase) return null;
  const { data, error } = await supabase
    .from("pre_cleaning_logs")
    .select("*")
    .eq("area", area)
    .order("submitted_at", { ascending: false })
    .limit(1);
  if (error) {
    alert("Failed to load pre-cleaning: " + (error.message || "Unknown error"));
    return null;
  }
  return data && data.length ? data[0] : null;
}

async function fetchLatestPostclean(precleanId) {
  if (!supabase || !precleanId) return null;
  const { data, error } = await supabase
    .from("post_cleaning_logs")
    .select("*")
    .eq("preclean_id", precleanId)
    .order("submitted_at", { ascending: false })
    .limit(1);
  if (error) {
    alert("Failed to load post-cleaning: " + (error.message || "Unknown error"));
    return null;
  }
  return data && data.length ? data[0] : null;
}

async function fetchDamages(area) {
  if (!supabase) return [];
  const { data, error } = await supabase
    .from("damage_reports")
    .select("*")
    .eq("area", area)
    .order("created_at", { ascending: false });
  if (error) {
    alert("Failed to load damages: " + (error.message || "Unknown error"));
    return [];
  }
  return data || [];
}

async function fetchLatestRelease() {
  if (!supabase) return null;
  // line_release_logs has no area column; this is the latest global release.
  const { data, error } = await supabase
    .from("line_release_logs")
    .select("*")
    .order("verified_at", { ascending: false })
    .limit(1);
  if (error) {
    alert("Failed to load release: " + (error.message || "Unknown error"));
    return null;
  }
  return data && data.length ? data[0] : null;
}

async function buildReport() {
  const area = localStorage.getItem("selectedArea") || "Area";
  const pre = await fetchLatestPreclean(area);
  const post = await fetchLatestPostclean(pre ? pre.id : null);
  const damage = await fetchDamages(area);
  const release = await fetchLatestRelease();

  let html = "";

  html += `<h3>Employee Information</h3>`;
  html += `<p><b>Name:</b> ${pre?.employee_name || "-"}</p>`;
  html += `<p><b>Pre-Cleaning Time:</b> ${pre?.submitted_at ? new Date(pre.submitted_at).toLocaleString() : "-"}</p>`;
  html += `<p><b>Post-Cleaning Time:</b> ${post?.submitted_at ? new Date(post.submitted_at).toLocaleString() : "-"}</p>`;

  html += `<hr><h3>Pre-Cleaning Checklist</h3>`;

  (pre?.checklist || []).forEach(item => {
    html += `
      <div style="margin-bottom:10px;">
        <b>${item.question || "Checklist item"}</b><br>
        Result: ${item.value || "-"}<br>
        Comment: ${item.comment || "—"}<br>
        Photo: ${item.photo || "—"}
      </div>
    `;
  });

  html += `<hr><h3>Post-Cleaning</h3>`;
  html += `<p>Bags Used: ${pre?.bags_used ?? "-"}</p>`;
  html += `<p>Bags Retrieved: ${post?.bags_returned ?? "-"}</p>`;

  html += `<hr><h3>Damage Report</h3>`;

  (damage || []).forEach(d => {
    html += `
      <div>
        ${fromStoredDescription(d.description)} — ${d.severity || "-"}
      </div>
    `;
  });

  html += `<hr><h3>Area Lead Release</h3>`;
  html += `<p>Released By: ${release?.released_by || "-"}</p>`;
  html += `<p>Date: ${release?.verified_at ? new Date(release.verified_at).toLocaleString() : "-"}</p>`;

  document.getElementById("reportContent").innerHTML = html;
}

buildReport();
</script>
<script>
window.onload = function () {
  const area =
    localStorage.getItem("selectedArea") || "Area";
  document.getElementById("areaName").innerText = area;
};
</script>
</body>
</html>
