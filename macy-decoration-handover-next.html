<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MACY Decoration - Handover Management</title>
  
  <!-- Mobile-Next Framework -->
  <link rel="stylesheet" href="css/mobile-next.css">
  
  <!-- Essential scripts only -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/dateUtils.js"></script>
  <script src="js/mobile-next.js"></script>
</head>
<body>

<div class="app-container">
  <!-- Fixed Header -->
  <header class="app-header">
    <div class="text-title">MACY Decoration</div>
    <div class="text-subtitle">Handover Management</div>
  </header>

  <!-- Scrollable Content -->
  <main class="app-content">
    <!-- Quick Stats -->
    <div class="card fade-in">
      <div class="text-section">Handover Overview</div>
      
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;">
        <div style="text-align: center; padding: 16px; background: rgba(251, 191, 36, 0.1); border-radius: 12px;">
          <div class="text-body" style="font-size: 24px; font-weight: 700; color: #fbbf24;" id="pendingCount">0</div>
          <div class="text-small">Pending Tasks</div>
        </div>
        <div style="text-align: center; padding: 16px; background: rgba(34, 197, 94, 0.1); border-radius: 12px;">
          <div class="text-body" style="font-size: 24px; font-weight: 700; color: #22c55e;" id="completedCount">0</div>
          <div class="text-small">Completed Today</div>
        </div>
      </div>
      
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
        <div style="text-align: center; padding: 16px; background: rgba(239, 68, 68, 0.1); border-radius: 12px;">
          <div class="text-body" style="font-size: 24px; font-weight: 700; color: #ef4444;" id="urgentCount">0</div>
          <div class="text-small">Urgent Tasks</div>
        </div>
        <div style="text-align: center; padding: 16px; background: rgba(59, 130, 246, 0.1); border-radius: 12px;">
          <div class="text-body" style="font-size: 24px; font-weight: 700; color: #3b82f6;" id="overdueCount">0</div>
          <div class="text-small">Overdue</div>
        </div>
      </div>
    </div>

    <!-- Filter and Sort -->
    <div class="card fade-in">
      <div class="text-section">Filter Tasks</div>
      
      <div class="form-group">
        <label class="text-label">Status</label>
        <select class="select" id="statusFilter" onchange="filterTasks()">
          <option value="">All Tasks</option>
          <option value="Pending">Pending</option>
          <option value="Completed">Completed</option>
        </select>
      </div>
      
      <div class="form-group">
        <label class="text-label">Source</label>
        <select class="select" id="sourceFilter" onchange="filterTasks()">
          <option value="">All Sources</option>
          <option value="pre-clean">Pre-Clean</option>
          <option value="post-clean">Post-Clean</option>
          <option value="damage">Damage Report</option>
          <option value="area-verification">Area Verification</option>
        </select>
      </div>
      
      <div class="form-group">
        <label class="text-label">Priority</label>
        <select class="select" id="priorityFilter" onchange="filterTasks()">
          <option value="">All Priorities</option>
          <option value="urgent">Urgent</option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>
      </div>
    </div>

    <!-- Pending Handover Tasks -->
    <div class="card fade-in">
      <div class="text-section">Pending Handover Tasks</div>
      <div id="pendingTasks"></div>
    </div>

    <!-- Recently Completed -->
    <div class="card fade-in">
      <div class="text-section">Recently Completed</div>
      <div id="completedTasks"></div>
    </div>

    <!-- Create New Handover Task -->
    <div class="card fade-in">
      <div class="text-section">Create New Handover Task</div>
      
      <div class="form-group">
        <label class="text-label">Task Description *</label>
        <textarea class="textarea" id="newTaskDescription" placeholder="Describe the handover task..." name="newTaskDescription"></textarea>
      </div>
      
      <div class="form-group">
        <label class="text-label">Priority</label>
        <select class="select" id="newTaskPriority" name="newTaskPriority">
          <option value="medium">Medium</option>
          <option value="low">Low</option>
          <option value="high">High</option>
          <option value="urgent">Urgent</option>
        </select>
      </div>
      
      <div class="form-group">
        <label class="text-label">Source</label>
        <select class="select" id="newTaskSource" name="newTaskSource">
          <option value="manual">Manual Entry</option>
          <option value="pre-clean">Pre-Clean</option>
          <option value="post-clean">Post-Clean</option>
          <option value="damage">Damage Report</option>
          <option value="area-verification">Area Verification</option>
        </select>
      </div>
      
      <div class="form-group">
        <label class="text-label">Assigned To</label>
        <input type="text" class="input" id="newTaskAssignedTo" placeholder="Enter assignee name" name="newTaskAssignedTo">
      </div>
      
      <div class="form-group">
        <label class="text-label">Due Date</label>
        <input type="date" class="input" id="newTaskDueDate" name="newTaskDueDate">
      </div>
      
      <div class="form-group">
        <label class="text-label">Additional Notes</label>
        <textarea class="textarea" id="newTaskNotes" placeholder="Any additional notes..." name="newTaskNotes"></textarea>
      </div>
      
      <button class="btn btn-primary btn-block" onclick="createNewTask()">
        <span>Create Handover Task</span>
      </button>
    </div>
  </main>

  <!-- Sticky Bottom Actions -->
  <div class="sticky-actions">
    <button class="btn btn-primary btn-block" onclick="refreshTasks()">
      <span>Refresh Tasks</span>
    </button>
    <button class="btn btn-secondary btn-block" onclick="exportTasks()">
      <span>Export Report</span>
    </button>
  </div>
</div>

<script>
// Initialize MobileNext framework
const mobileNext = window.MobileNext;
const supabase = window.supabaseClient;

// Page data
let allTasks = [];
let filteredTasks = [];
let stats = {
  pending: 0,
  completed: 0,
  urgent: 0,
  overdue: 0
};

// Load handover tasks
async function loadHandoverTasks() {
  try {
    mobileNext.showLoading('Loading handover tasks...');
    
    const { data, error } = await supabase
      .from('handover_tasks')
      .select('*')
      .eq('area', 'MACY_DECORATION')
      .order('created_at', { ascending: false })
      .limit(50);
    
    if (error) throw error;
    
    allTasks = data || [];
    filteredTasks = [...allTasks];
    
    updateStats();
    renderTasks();
    
  } catch (error) {
    console.error('Error loading handover tasks:', error);
    mobileNext.showToast('Failed to load handover tasks', 'error');
  } finally {
    mobileNext.hideLoading();
  }
}

// Update statistics
function updateStats() {
  const today = new Date().toDateString();
  
  stats.pending = allTasks.filter(task => task.status === 'Pending').length;
  stats.completed = allTasks.filter(task => 
    task.status === 'Completed' && 
    new Date(task.completed_at || task.created_at).toDateString() === today
  ).length;
  stats.urgent = allTasks.filter(task => 
    task.status === 'Pending' && 
    isTaskUrgent(task)
  ).length;
  stats.overdue = allTasks.filter(task => 
    task.status === 'Pending' && 
    isTaskOverdue(task)
  ).length;
  
  // Update UI
  document.getElementById('pendingCount').textContent = stats.pending;
  document.getElementById('completedCount').textContent = stats.completed;
  document.getElementById('urgentCount').textContent = stats.urgent;
  document.getElementById('overdueCount').textContent = stats.overdue;
}

// Check if task is urgent
function isTaskUrgent(task) {
  // Check if task description contains urgent keywords
  const urgentKeywords = ['urgent', 'emergency', 'critical', 'immediate', 'asap'];
  const description = (task.task_description || '').toLowerCase();
  return urgentKeywords.some(keyword => description.includes(keyword));
}

// Check if task is overdue
function isTaskOverdue(task) {
  // Consider tasks overdue if created more than 24 hours ago
  const createdTime = new Date(task.created_at);
  const now = new Date();
  const hoursDiff = (now - createdTime) / (1000 * 60 * 60);
  return hoursDiff > 24;
}

// Filter tasks
function filterTasks() {
  const statusFilter = document.getElementById('statusFilter').value;
  const sourceFilter = document.getElementById('sourceFilter').value;
  const priorityFilter = document.getElementById('priorityFilter').value;
  
  filteredTasks = allTasks.filter(task => {
    if (statusFilter && task.status !== statusFilter) return false;
    if (sourceFilter && task.source !== sourceFilter) return false;
    if (priorityFilter) {
      const taskPriority = getTaskPriority(task);
      if (taskPriority !== priorityFilter) return false;
    }
    return true;
  });
  
  renderTasks();
}

// Get task priority
function getTaskPriority(task) {
  if (isTaskUrgent(task)) return 'urgent';
  if (isTaskOverdue(task)) return 'high';
  return 'medium'; // Default priority
}

// Render tasks
function renderTasks() {
  renderPendingTasks();
  renderCompletedTasks();
}

// Render pending tasks
function renderPendingTasks() {
  const pendingTasksEl = document.getElementById('pendingTasks');
  pendingTasksEl.innerHTML = '';
  
  const pendingTasks = filteredTasks.filter(task => task.status === 'Pending');
  
  if (pendingTasks.length === 0) {
    pendingTasksEl.innerHTML = '<p class="text-body text-center">No pending tasks</p>';
    return;
  }
  
  pendingTasks.forEach(task => {
    const taskCard = createTaskCard(task, false);
    pendingTasksEl.appendChild(taskCard);
  });
}

// Render completed tasks
function renderCompletedTasks() {
  const completedTasksEl = document.getElementById('completedTasks');
  completedTasksEl.innerHTML = '';
  
  const completedTasks = filteredTasks.filter(task => task.status === 'Completed').slice(0, 10);
  
  if (completedTasks.length === 0) {
    completedTasksEl.innerHTML = '<p class="text-body text-center">No completed tasks today</p>';
    return;
  }
  
  completedTasks.forEach(task => {
    const taskCard = createTaskCard(task, true);
    completedTasksEl.appendChild(taskCard);
  });
}

// Create task card
function createTaskCard(task, isCompleted) {
  const taskCard = document.createElement('div');
  taskCard.className = 'card mb-2';
  
  const priority = getTaskPriority(task);
  const priorityColor = priority === 'urgent' ? '#ef4444' : 
                       priority === 'high' ? '#f59e0b' : 
                       priority === 'medium' ? '#3b82f6' : 
                       '#22c55e';
  
  const isOverdue = !isCompleted && isTaskOverdue(task);
  
  taskCard.innerHTML = `
    <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 12px;">
      <div style="flex: 1;">
        <div class="text-body" style="font-weight: 600;">${task.task_description}</div>
        <div class="text-small" style="color: #94a3b8;">
          Source: ${task.source} • ${new Date(task.created_at).toLocaleDateString()}
        </div>
        ${task.completed_by ? `
          <div class="text-small" style="color: #22c55e;">
            Completed by: ${task.completed_by}
          </div>
        ` : ''}
      </div>
      <div style="text-align: right;">
        <span class="status ${isCompleted ? 'status-completed' : 'status-pending'}">
          ${task.status}
        </span>
        <div class="text-small" style="color: ${priorityColor}; margin-top: 4px; font-weight: 600;">
          ${priority.toUpperCase()}
          ${isOverdue ? ' • OVERDUE' : ''}
        </div>
      </div>
    </div>
    
    ${!isCompleted ? `
      <div style="display: flex; gap: 8px;">
        <button class="btn btn-success" style="flex: 1; font-size: 14px; padding: 8px 12px;" onclick="completeTask('${task.id}')">
          Complete
        </button>
        <button class="btn btn-secondary" style="flex: 1; font-size: 14px; padding: 8px 12px;" onclick="editTask('${task.id}')">
          Edit
        </button>
      </div>
    ` : `
      ${task.completed_photo ? `
        <div style="margin-top: 12px;">
          <img src="${task.completed_photo}" style="width: 60px; height: 60px; object-fit: cover; border-radius: 8px;">
        </div>
      ` : ''}
    `}
  `;
  
  return taskCard;
}

// Complete task
async function completeTask(taskId) {
  const task = allTasks.find(t => t.id === taskId);
  if (!task) return;
  
  mobileNext.confirm(
    'Complete Task',
    `Mark this task as completed?\n\n"${task.task_description}"`,
    async () => {
      try {
        mobileNext.showLoading('Completing task...');
        
        const completedBy = prompt('Enter your name:') || 'Unknown';
        
        const { error } = await supabase
          .from('handover_tasks')
          .update({
            status: 'Completed',
            completed_by: completedBy,
            completed_at: DateUtils.getCurrentTimestamp()
          })
          .eq('id', taskId);
        
        if (error) throw error;
        
        mobileNext.hideLoading();
        mobileNext.showToast('Task completed successfully', 'success');
        loadHandoverTasks();
        
      } catch (error) {
        console.error('Error completing task:', error);
        mobileNext.hideLoading();
        mobileNext.showToast('Failed to complete task', 'error');
      }
    }
  );
}

// Edit task
function editTask(taskId) {
  const task = allTasks.find(t => t.id === taskId);
  if (!task) return;
  
  // For now, just show task details
  mobileNext.confirm(
    'Task Details',
    `Task: ${task.task_description}\nSource: ${task.source}\nCreated: ${new Date(task.created_at).toLocaleString()}`,
    () => {
      // TODO: Implement edit functionality
      mobileNext.showToast('Edit feature coming soon', 'info');
    },
    null
  );
}

// Create new task
async function createNewTask() {
  const description = document.getElementById('newTaskDescription').value.trim();
  const priority = document.getElementById('newTaskPriority').value;
  const source = document.getElementById('newTaskSource').value;
  const assignedTo = document.getElementById('newTaskAssignedTo').value.trim();
  const dueDate = document.getElementById('newTaskDueDate').value;
  const notes = document.getElementById('newTaskNotes').value.trim();
  
  if (!description) {
    mobileNext.showToast('Task description is required', 'error');
    return;
  }
  
  try {
    mobileNext.showLoading('Creating handover task...');
    
    const { data, error } = await supabase
      .from('handover_tasks')
      .insert({
        area: 'MACY_DECORATION',
        source: source,
        task_description: description,
        priority: priority,
        assigned_to: assignedTo,
        due_date: dueDate,
        notes: notes,
        status: 'Pending',
        created_at: DateUtils.getCurrentTimestamp()
      });
    
    if (error) throw error;
    
    mobileNext.hideLoading();
    mobileNext.showToast('Handover task created successfully', 'success');
    
    // Clear form
    document.getElementById('newTaskDescription').value = '';
    document.getElementById('newTaskPriority').value = 'medium';
    document.getElementById('newTaskSource').value = 'manual';
    document.getElementById('newTaskAssignedTo').value = '';
    document.getElementById('newTaskDueDate').value = '';
    document.getElementById('newTaskNotes').value = '';
    
    // Refresh tasks
    loadHandoverTasks();
    
  } catch (error) {
    console.error('Error creating task:', error);
    mobileNext.hideLoading();
    mobileNext.showToast('Failed to create task', 'error');
  }
}

// Refresh tasks
function refreshTasks() {
  loadHandoverTasks();
  mobileNext.showToast('Tasks refreshed', 'success');
}

// Export tasks
function exportTasks() {
  mobileNext.showToast('Export feature coming soon', 'info');
}

// Auto-refresh every 30 seconds
setInterval(() => {
  loadHandoverTasks();
}, 30000);

// Initialize page
document.addEventListener('DOMContentLoaded', function() {
  loadHandoverTasks();
  console.log('🚀 MACY Decoration Handover Management page loaded');
});
</script>

</body>
</html>
