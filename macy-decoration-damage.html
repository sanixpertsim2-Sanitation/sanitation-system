<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MACY Decoration – Damage Reports</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="css/style.css">

<style>
.section{
  background:rgba(255,255,255,0.08);
  padding:22px;
  border-radius:18px;
  margin-bottom:25px;
}
.damage-card{
  border:1px solid rgba(255,255,255,.2);
  padding:16px;
  border-radius:14px;
  margin-bottom:18px;
}
textarea, input, select{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:none;
  margin-top:8px;
}
.submit-btn{
  width:100%;
  padding:18px;
  border-radius:18px;
  border:none;
  background:linear-gradient(135deg,#ef4444,#dc2626);
  color:#fff;
  font-size:18px;
  cursor:pointer;
}
.status-badge{
  display:inline-block;
  padding:4px 10px;
  border-radius:999px;
  font-size:12px;
  margin-top:6px;
}
.status-warning{background:#f59e0b;}
.status-ok{background:#22c55e;}
.hidden{display:none;}
</style>
</head>

<body>

<div class="container">

<h1 class="page-title">MACY – Decoration</h1>
<h3>Damage Reporting</h3>

<!-- NEW DAMAGE -->
<div class="section">
  <h3>Log New Damage</h3>

  <label>Area</label>
  <input type="text" id="area" readonly>

  <label>Description *</label>
  <textarea id="damageDesc"></textarea>

  <label>Severity</label>
  <select id="severity">
    <option>Low</option>
    <option>Medium</option>
    <option>High</option>
  </select>

  <button class="submit-btn" onclick="submitDamage()">Submit Damage</button>
</div>

<!-- EXISTING -->
<div class="section">
  <h3>Reported Damages</h3>
  <div id="damageList"></div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script>
const supabase = window.supabaseClient;

function setButtonBusy(btn, isBusy) {
  if (!btn) return;
  btn.disabled = isBusy;
  btn.dataset.busy = isBusy ? "1" : "0";
  btn.style.opacity = isBusy ? "0.7" : "1";
}

function updateDamageButton() {
  const btn = document.querySelector("button[onclick='submitDamage()']");
  if (!btn || btn.dataset.busy === "1") return;
  const area = document.getElementById("area").value.trim();
  const desc = document.getElementById("damageDesc").value.trim();
  btn.disabled = !(area && desc);
}

function fromStoredDescription(stored) {
  try {
    const parsed = JSON.parse(stored);
    if (parsed && typeof parsed === "object" && "text" in parsed) {
      return parsed.text || "";
    }
  } catch (e) {
    // keep fallback
  }
  return stored || "";
}

async function readFileBase64(file) {
  if (!file) return "";
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result || "");
    reader.readAsDataURL(file);
  });
}

async function submitDamage(){

  const btn = document.querySelector("button[onclick='submitDamage()']");
  if (btn && btn.dataset.busy === "1") return;
  setButtonBusy(btn, true);

  const area = document.getElementById("area").value.trim();
  const desc = document.getElementById("damageDesc").value.trim();
  const severity = document.getElementById("severity").value;

  if(!area || !desc){
    alert("Area and description required.");
    setButtonBusy(btn, false);
    return;
  }

  if (!supabase) {
    alert("Supabase client not loaded.");
    setButtonBusy(btn, false);
    return;
  }

  const payload = {
    text: desc
  };

  try {
    // Audit/webhook safe point: new damage record persisted.
    const { error } = await supabase
      .from("damage_reports")
      .insert({
        area: area,
        description: JSON.stringify(payload),
        severity: severity,
        status: "Open",
        created_at: new Date().toISOString()
      });

    if (error) {
      alert("Failed to submit damage: " + (error.message || "Unknown error"));
      setButtonBusy(btn, false);
      return;
    }
  } catch (e) {
    alert("Failed to submit damage. Please try again.");
    setButtonBusy(btn, false);
    return;
  }

  document.getElementById("damageDesc").value = "";
  setButtonBusy(btn, false);
  loadDamages();
}

function statusClass(status) {
  if (status === "Completed") return "status-ok";
  if (status === "Handover") return "status-warning";
  return "status-warning";
}

async function loadDamages(){
  const list=document.getElementById("damageList");
  list.innerHTML="";

  if (!supabase) {
    list.innerHTML = "<p>Supabase not available.</p>";
    return;
  }

  const area = document.getElementById("area").value.trim();

  const { data, error } = await supabase
    .from("damage_reports")
    .select("*")
    .eq("area", area)
    .order("created_at", { ascending: false });

  if (error) {
    list.innerHTML = "<p>Failed to load damages.</p>";
    return;
  }

  (data || []).forEach(d=>{
    list.innerHTML+=`
      <div class="damage-card">
        <b>${d.area}</b><br>
        ${fromStoredDescription(d.description)}
        <br>
        <span class="status-badge ${statusClass(d.status)}">${d.status}</span>

        ${d.status==="Completed" && d.completed_photo
          ? `<img src="${d.completed_photo}" alt="Completion" style="width:100%;margin-top:12px;border-radius:10px">`
          : ""
        }

        ${d.status==="Open" ? `
        <div style="margin-top:10px">
          <button class="submit-btn" onclick="markCompleted('${d.id}')">
            Mark Completed
          </button>
        </div>
        ` : ""}
      </div>`;
  });
}

async function markCompleted(id){
  const who = prompt("Who completed the repair?");
  if(!who) return;

  const fileInput = document.createElement("input");
  fileInput.type="file";
  fileInput.accept="image/*";
  fileInput.capture="environment";
  fileInput.onchange=async()=>{
    if(!fileInput.files.length) return;
    const photo = await readFileBase64(fileInput.files[0]);
    const { error } = await supabase
      .from("damage_reports")
      .update({
        status:"Completed",
        completed_by:who,
        completed_photo:photo,
        completed_at:new Date().toISOString()
      })
      .eq("id",id);
    if (error) {
      alert("Failed to mark completed: " + (error.message || "Unknown error"));
      return;
    }
    loadDamages();
  };
  fileInput.click();
}

document.getElementById("damageDesc")
  .addEventListener("input", updateDamageButton);

window.onload=()=>{
  const area = "MACY_DECORATION";
  localStorage.setItem("selectedArea", area);
  document.getElementById("area").value = area;
  updateDamageButton();
  loadDamages();
};
</script>

</body>
</html>
