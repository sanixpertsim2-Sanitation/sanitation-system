<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MACY – Pre-Cleaning</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(135deg,#020617,#0f172a);
  color: white;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 30px;
}

.section {
  background: rgba(255,255,255,0.08);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 25px;
  box-shadow: 0 0 20px rgba(0,140,255,.3);
}

h1, h3 {
  color: #7fd6ff;
}

input, select, textarea {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: none;
  margin-top: 8px;
}

textarea {
  min-height: 70px;
}

.hidden {
  display: none;
}

button {
  width: 100%;
  padding: 16px;
  font-size: 18px;
  background: linear-gradient(135deg,#00b3ff,#0066ff);
  border: none;
  border-radius: 16px;
  color: white;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="container">

<h1 class="page-title">
  MACY – <span id="areaName"></span>
</h1>
<h3>Pre-Cleaning Verification</h3>

<div class="section">
  <h3>General Information</h3>

  Employee Name *
  <input id="empName">

  Date & Time
  <input id="dateTime" readonly>

  Number of bags used *
  <input id="bags" type="number">
</div>

<div class="section">
  <h3>Conveyor Area</h3>

  Belts inspected and free from debris
  <select class="answer" onchange="toggleExtra(this)">
    <option value="">Select</option>
    <option>Acceptable</option>
    <option>Not Acceptable</option>
    <option>NA</option>
  </select>

  <div class="extra hidden">
    <input type="file" accept="image/*">
    <textarea placeholder="Comment required..."></textarea>
  </div>
</div>

<div class="section">
  <h3>Guards & Covers</h3>

  All guards removed and accessible
  <select class="answer" onchange="toggleExtra(this)">
    <option value="">Select</option>
    <option>Acceptable</option>
    <option>Not Acceptable</option>
    <option>NA</option>
  </select>

  <div class="extra hidden">
    <input type="file" accept="image/*">
    <textarea placeholder="Comment required..."></textarea>
  </div>
</div>

<div class="section">
  <h3>Frames & Structure</h3>

  Frames cleaned and free from residue
  <select class="answer" onchange="toggleExtra(this)">
    <option value="">Select</option>
    <option>Acceptable</option>
    <option>Not Acceptable</option>
    <option>NA</option>
  </select>

  <div class="extra hidden">
    <input type="file" accept="image/*">
    <textarea placeholder="Comment required..."></textarea>
  </div>
</div>

<button onclick="submitPreCleaning()">Submit Pre-Cleaning</button>

</div>

<script>
/* AUTO DATE */
window.addEventListener("load", () => {
  document.getElementById("dateTime").value =
    new Date().toLocaleString("en-CA");

  if (localStorage.getItem("precleanDone") === "YES") {
    alert("Pre-cleaning already submitted.");
    location.href = "area.html";
  }
});

function toggleExtra(sel) {
  const extra = sel.parentElement.querySelector(".extra");
  if (sel.value === "Not Acceptable" || sel.value === "NA")
    extra.classList.remove("hidden");
  else
    extra.classList.add("hidden");
}

function submitPreCleaning() {

  const emp = document.getElementById("empName").value.trim();
  const bags = document.getElementById("bags").value.trim();

  if (!emp || !bags) {
    alert("Employee name and bags required.");
    return;
  }

  const answers = document.querySelectorAll(".answer");
  for (let s of answers) {
    if (!s.value) {
      alert("Complete all checklist items.");
      return;
    }

    if (s.value !== "Acceptable") {
      const ex = s.parentElement.querySelector(".extra");
      if (
        !ex.querySelector("input").files.length ||
        !ex.querySelector("textarea").value.trim()
      ) {
        alert("Photo and comment required.");
        return;
      }
    }
  }

  localStorage.setItem("precleanDone", "YES");
  localStorage.setItem("bagsUsed", bags);
  localStorage.setItem("precleanEmployee", emp);
  localStorage.setItem("precleanTime", new Date().toLocaleString());

  alert("✅ Pre-Cleaning Submitted");
  location.href = "area.html";
}
</script>
<script>
window.onload = function () {

  const area =
    localStorage.getItem("selectedArea") || "Area";

  const label = document.getElementById("areaName");

  if (label) {
    label.innerText = area;
  }

};
</script>
</body>
</html>
