<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sanitation Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
</head>

<body>
  <div class="container">
    <div class="card">
      <h1>Sanixpert – Intelligent Digital Sanitation Checklist</h1>
      <h2>Give & Go • Sanitation Department</h2>
      <p>Select a line to begin sanitation checks</p>
    </div>

    <div class="card" style="margin-top:18px;">
      <div class="line-card" onclick="selectLine('MACY')" role="button" tabindex="0">
        <img class="line-image" src="images/macy.jpg" alt="MACY Cupcake Line">
        <div class="line-content">
          <div class="line-title">MACY (Cupcake)</div>
          <div class="line-sub">Active</div>
        </div>
      </div>

      <div class="line-card line-card--disabled">
        <img class="line-image" src="images/jfk.jpg" alt="JFK Doughnut Line">
        <div class="line-content">
          <div class="line-title">JFK (Doughnut)</div>
          <div class="line-sub">Coming Soon — Stay Tuned</div>
        </div>
      </div>

      <div class="line-card line-card--disabled">
        <img class="line-image" src="images/cece.jpg" alt="CECE Cookie Line">
        <div class="line-content">
          <div class="line-title">CECE (Cookies)</div>
          <div class="line-sub">Coming Soon — Stay Tuned</div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/layout.js"></script>
</body>

</html>
