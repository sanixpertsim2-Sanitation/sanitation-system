<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MACY – Production Pre-Cleaning</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="css/style.css">

<style>
.section {
  background: rgba(255,255,255,0.07);
  border-radius: 18px;
  padding: 22px;
  margin-bottom: 25px;
  box-shadow: 0 0 25px rgba(0,150,255,.25);
}

.section h3 {
  color: #7fd6ff;
  margin-bottom: 15px;
}

.question {
  margin-bottom: 18px;
}

select, input, textarea {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  border: none;
  margin-top: 6px;
}

textarea {
  min-height: 60px;
}

.hidden {
  display: none;
}

.submit-btn {
  width: 100%;
  padding: 16px;
  font-size: 18px;
  background: linear-gradient(135deg,#00b3ff,#0066ff);
  border: none;
  border-radius: 16px;
  color: white;
  cursor: pointer;
  box-shadow: 0 0 25px rgba(0,140,255,.7);
}
</style>
</head>

<body>

<div class="container">

<h1 class="page-title">MACY – Production</h1>
<h3>Pre-Cleaning Verification</h3>

<!-- GENERAL INFO -->
<div class="section">
  <h3>General Information</h3>

  <label>Employee Name *</label>
  <input
    type="text"
    id="employeeName"
    placeholder="Enter your name"
    oninput="saveWorkerName()">

  <label>Date & Time</label>
  <input type="text" id="dateTime" readonly>

  <label>Number of bags used *</label>
  <input type="number" id="bagsUsed">
</div>

<!-- CHECKLIST -->
<div class="section">
  <h3>Production Area Checklist</h3>

  <!-- QUESTION TEMPLATE -->
  <div class="question">
    No product residue present
    <select onchange="toggleExtra(this)">
      <option value="">Select</option>
      <option>Acceptable</option>
      <option>Not Acceptable</option>
      <option>NA</option>
    </select>
    <div class="extra hidden">
      <input type="file" accept="image/*" capture="environment">
      <textarea placeholder="Comment required..."></textarea>
    </div>
  </div>

  <div class="question">
    Conveyor belts accessible
    <select onchange="toggleExtra(this)">
      <option value="">Select</option>
      <option>Acceptable</option>
      <option>Not Acceptable</option>
      <option>NA</option>
    </select>
    <div class="extra hidden">
      <input type="file" accept="image/*" capture="environment">
      <textarea placeholder="Comment required..."></textarea>
    </div>
  </div>

  <div class="question">
    Frames and structure accessible
    <select onchange="toggleExtra(this)">
      <option value="">Select</option>
      <option>Acceptable</option>
      <option>Not Acceptable</option>
      <option>NA</option>
    </select>
    <div class="extra hidden">
      <input type="file" accept="image/*" capture="environment">
      <textarea placeholder="Comment required..."></textarea>
    </div>
  </div>

  <div class="question">
    Guards and covers removed
    <select onchange="toggleExtra(this)">
      <option value="">Select</option>
      <option>Acceptable</option>
      <option>Not Acceptable</option>
      <option>NA</option>
    </select>
    <div class="extra hidden">
      <input type="file" accept="image/*" capture="environment">
      <textarea placeholder="Comment required..."></textarea>
    </div>
  </div>

  <div class="question">
    Motors protected
    <select onchange="toggleExtra(this)">
      <option value="">Select</option>
      <option>Acceptable</option>
      <option>Not Acceptable</option>
      <option>NA</option>
    </select>
    <div class="extra hidden">
      <input type="file" accept="image/*" capture="environment">
      <textarea placeholder="Comment required..."></textarea>
    </div>
  </div>

</div>

<button class="submit-btn" onclick="submitPreCleaning()">
  Submit Pre-Cleaning
</button>

</div>

<script>
/* ===========================
   AUTO DATE TIME
=========================== */
(() => {
  document.getElementById("dateTime").value =
    new Date().toLocaleString();
})();

/* ===========================
   SAVE WORKER NAME LIVE
=========================== */
function saveWorkerName() {
  const name =
    document.getElementById("employeeName").value.trim();

  if (name.length > 0) {
    localStorage.setItem(
      "macyPrecleanInProgressBy",
      name
    );
  }
}

/* ===========================
   LOAD EXISTING WORKER
=========================== */
window.onload = function () {

  const existing =
    localStorage.getItem("macyPrecleanInProgressBy");

  if (existing) {
    document.getElementById("employeeName").value = existing;

    alert(
      "⚠️ Pre-cleaning is currently in progress by:\n\n" +
      existing +
      "\n\nIf this is you, continue.\n" +
      "If not, contact supervisor."
    );
  }
};

/* ===========================
   TOGGLE PHOTO + COMMENT
=========================== */
function toggleExtra(select) {
  const extra =
    select.parentElement.querySelector(".extra");

  if (
    select.value === "Not Acceptable" ||
    select.value === "NA"
  ) {
    extra.classList.remove("hidden");
  } else {
    extra.classList.add("hidden");
  }
}

/* ===========================
   SUBMIT PRE-CLEANING
=========================== */
function submitPreCleaning() {

  const emp =
    document.getElementById("employeeName").value.trim();

  const bags =
    document.getElementById("bagsUsed").value.trim();

  if (!emp || !bags) {
    alert("Employee name and bag count are mandatory.");
    return;
  }

  const questions =
    document.querySelectorAll(".question");

  for (let i = 0; i < questions.length; i++) {

    const select =
      questions[i].querySelector("select");

    if (!select.value) {
      alert(`Please answer question ${i + 1}`);
      return;
    }

    if (select.value !== "Acceptable") {

      const extra =
        questions[i].querySelector(".extra");

      const photo =
        extra.querySelector("input").files.length;

      const comment =
        extra.querySelector("textarea").value.trim();

      if (!photo || !comment) {
        alert(
          `Photo and comment required for question ${i + 1}`
        );
        return;
      }
    }
  }

  localStorage.setItem("macyProdPrecleanDone", "YES");
  localStorage.setItem("macyProdPrecleanTimestamp", Date.now());
  localStorage.setItem("macyProdPrecleanEmployee", emp);
  localStorage.setItem("macyProdPrecleanBagsUsed", bags);

  /* clear in-progress lock */
  localStorage.removeItem("macyPrecleanInProgressBy");

  alert("✅ Pre-Cleaning Submitted Successfully");

  window.location.href =
    "macy-production-control.html";
}
</script>

</body>
</html>
