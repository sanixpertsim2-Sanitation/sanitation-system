<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MACY – Production Pre-Cleaning</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="css/style.css">

<style>
.section {
  background: rgba(255,255,255,0.07);
  border-radius: 18px;
  padding: 22px;
  margin-bottom: 25px;
  box-shadow: 0 0 25px rgba(0,150,255,.25);
}

.section h3 {
  color: #7fd6ff;
  margin-bottom: 15px;
}

.question { margin-bottom: 18px; }

select, input, textarea {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  border: none;
  margin-top: 6px;
}

textarea { min-height: 60px; }

.hidden { display:none; }

.submit-btn {
  width:100%;
  padding:16px;
  font-size:18px;
  background:linear-gradient(135deg,#00b3ff,#0066ff);
  border:none;
  border-radius:16px;
  color:white;
  cursor:pointer;
  box-shadow:0 0 25px rgba(0,140,255,.7);
}
</style>
</head>

<body>

<div class="container">

<h1 class="page-title">MACY – Production</h1>
<h3>Pre-Cleaning Verification</h3>

<!-- GENERAL -->
<div class="section">
  <h3>General Information</h3>

  <label>Employee Name *</label>
  <input type="text" id="employeeName">

  <label>Date & Time</label>
  <input type="text" id="dateTime" readonly>

  <label>Number of bags used *</label>
  <input type="number" id="bagsUsed">
</div>

<!-- CHECKLIST -->
<div class="section">
  <h3>Production Area Checklist</h3>

  <div class="question">
    No product residue present
    <select onchange="toggleExtra(this)">
      <option value="">Select</option>
      <option>Acceptable</option>
      <option>Not Acceptable</option>
      <option>N/A</option>
    </select>
    <div class="extra hidden">
      <input type="file" accept="image/*" capture="environment">
      <textarea placeholder="Comment required"></textarea>
    </div>
  </div>
</div>

<button id="submitBtn" class="submit-btn" onclick="submitPreClean()">
  Submit Pre-Cleaning
</button>

</div>

<!-- LOCK OVERLAY -->
<div id="lockOverlay"
     style="
     display:none;
     position:fixed;
     inset:0;
     background:rgba(15,23,42,.93);
     color:white;
     z-index:9999;
     text-align:center;
     padding:30px;
     display:flex;
     flex-direction:column;
     justify-content:center;
     align-items:center">

  <h1>🔒 Pre-Cleaning Locked</h1>

  <p id="lockTime" style="opacity:.8"></p>

  <p style="opacity:.6">
    Locked for 48 hours after submission
  </p>

  <button onclick="adminUnlock()"
    style="
      margin-top:25px;
      padding:12px 28px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.3);
      background:transparent;
      color:rgba(255,255,255,.75)">
    Admin Unlock
  </button>
</div>

<script>
const ADMIN_PIN = "0735";
const LOCK_HOURS = 48;

/* AUTO TIME */
document.getElementById("dateTime").value =
  new Date().toLocaleString();

/* CHECK LOCK */
(function(){

  const done = localStorage.getItem("macyProdPrecleanDone");
  const time = localStorage.getItem("macyProdPrecleanTimestamp");

  // never lock if never submitted
  if (done !== "YES" || !time) return;

  const diffHours =
    (Date.now() - Number(time)) / (1000*60*60);

  // AUTO RESET AFTER 48 HOURS
  if (diffHours >= LOCK_HOURS) {
    localStorage.removeItem("macyProdPrecleanDone");
    localStorage.removeItem("macyProdPrecleanTimestamp");
    return;
  }

  // LOCK ACTIVE
  document.getElementById("lockOverlay").style.display = "flex";
  document.getElementById("submitBtn").disabled = true;
  document.getElementById("submitBtn").style.opacity = "0.4";

  document.getElementById("lockTime").innerHTML =
    "Submitted at:<br><b>" +
    new Date(Number(time)).toLocaleString() +
    "</b>";

})();

/* ADMIN UNLOCK */
function adminUnlock(){
  const pin = prompt("Supervisor PIN");
  if (pin === ADMIN_PIN) {
    document.getElementById("lockOverlay").style.display = "none";
    document.getElementById("submitBtn").disabled = false;
    document.getElementById("submitBtn").style.opacity = "1";
    alert("✅ Unlocked temporarily");
  } else {
    alert("❌ Incorrect PIN");
  }
}

/* TOGGLE */
function toggleExtra(sel){
  const extra = sel.parentElement.querySelector(".extra");
  if (sel.value !== "Acceptable") extra.classList.remove("hidden");
  else extra.classList.add("hidden");
}

/* SUBMIT */
function submitPreClean(){

  const emp = employeeName.value.trim();
  const bags = bagsUsed.value.trim();

  if(!emp || !bags){
    alert("Employee name and bags required");
    return;
  }

  localStorage.setItem("macyProdPrecleanDone","YES");
  localStorage.setItem("macyProdPrecleanTimestamp",Date.now());

  alert("✅ Pre-Cleaning submitted successfully");
  location.reload();
}
</script>

</body>
</html>
