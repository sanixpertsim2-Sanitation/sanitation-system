<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MACY – Production Pre-Cleaning</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="css/style.css">

<style>
.section {
  background: rgba(255,255,255,0.07);
  border-radius: 18px;
  padding: 22px;
  margin-bottom: 25px;
  box-shadow: 0 0 25px rgba(0,150,255,.25);
}

.section h3 {
  color: #7fd6ff;
  margin-bottom: 15px;
}

.question {
  margin-bottom: 18px;
}

select, input, textarea {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  border: none;
  margin-top: 6px;
}

textarea { min-height: 60px; }

.hidden { display: none; }

.submit-btn {
  width: 100%;
  padding: 16px;
  font-size: 18px;
  background: linear-gradient(135deg,#00b3ff,#0066ff);
  border: none;
  border-radius: 16px;
  color: white;
  cursor: pointer;
  box-shadow: 0 0 25px rgba(0,140,255,.7);
}

/* LOCK OVERLAY */
#precleanLockOverlay {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(2,6,23,.94);
  z-index:9999;
  color:white;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:30px;
}
</style>
</head>

<body>

<div class="container">

<h1 class="page-title">MACY – Production</h1>
<h3>Pre-Cleaning Verification</h3>

<!-- GENERAL INFO -->
<div class="section">
  <h3>General Information</h3>

  <label>Employee Name *</label>
  <input type="text" id="employeeName">

  <label>Date & Time</label>
  <input type="text" id="dateTime" readonly>

  <label>Number of bags used *</label>
  <input type="number" id="bagsUsed">
</div>

<!-- CHECKLIST -->
<div class="section">
  <h3>Production Area Checklist</h3>

  <div class="question">
    No product residue present
    <select onchange="toggleExtra(this)">
      <option value="">Select</option>
      <option>Acceptable</option>
      <option>Not Acceptable</option>
      <option>NA</option>
    </select>
    <div class="extra hidden">
      <input type="file" accept="image/*" capture="environment">
      <textarea placeholder="Comment required"></textarea>
    </div>
  </div>

  <div class="question">
    Conveyor belts accessible
    <select onchange="toggleExtra(this)">
      <option value="">Select</option>
      <option>Acceptable</option>
      <option>Not Acceptable</option>
      <option>NA</option>
    </select>
    <div class="extra hidden">
      <input type="file" accept="image/*" capture="environment">
      <textarea placeholder="Comment required"></textarea>
    </div>
  </div>

</div>

<button class="submit-btn" onclick="submitPreCleaning()">
  Submit Pre-Cleaning
</button>

</div>

<!-- 🔒 LOCK OVERLAY -->
<div id="precleanLockOverlay">
  <h1>🔒 Pre-Cleaning Locked</h1>
  <p id="lockTime" style="margin-top:10px;opacity:.85"></p>
  <p style="opacity:.6">Supervisor unlock required</p>

  <button onclick="adminUnlock()"
    style="
      margin-top:25px;
      padding:12px 28px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.25);
      background:transparent;
      color:#cbd5f5;
      font-size:14px;
      cursor:pointer;
      opacity:.7;">
    🔐 Admin Unlock
  </button>
</div>

<script>
/* ================= CONFIG ================= */
const ADMIN_PIN = "0735";
const LOCK_HOURS = 48;

/* AUTO DATE */
document.getElementById("dateTime").value =
  new Date().toLocaleString();

/* TOGGLE EXTRA */
function toggleExtra(select) {
  const extra = select.parentElement.querySelector(".extra");
  if (select.value !== "Acceptable") {
    extra.classList.remove("hidden");
  } else {
    extra.classList.add("hidden");
  }
}

/* LOCK CHECK */
function checkPrecleanLock() {

  const done = localStorage.getItem("macyProdPrecleanDone");
  const time = localStorage.getItem("macyProdPrecleanTimestamp");

  if (!done || !time) return;

  const diff =
    (Date.now() - Number(time)) / (1000 * 60 * 60);

  if (diff < LOCK_HOURS) {

    document.getElementById("precleanLockOverlay").style.display = "flex";

    document.getElementById("lockTime").innerHTML =
      "Submitted at:<br><b>" +
      new Date(Number(time)).toLocaleString() +
      "</b>";

    document.querySelector(".submit-btn").disabled = true;
    document.querySelector(".submit-btn").style.opacity = "0.4";
  }
}

/* ADMIN UNLOCK */
function adminUnlock() {

  const pin = prompt("🔐 Supervisor Unlock\n\nEnter Admin PIN");

  if (pin === ADMIN_PIN) {

    localStorage.removeItem("macyProdPrecleanDone");
    localStorage.removeItem("macyProdPrecleanTimestamp");

    alert("✅ Pre-cleaning unlocked");
    location.reload();

  } else {
    alert("❌ Incorrect PIN");
  }
}

/* SUBMIT */
function submitPreCleaning() {

  const emp = document.getElementById("employeeName").value.trim();
  const bags = document.getElementById("bagsUsed").value.trim();

  if (!emp || !bags) {
    alert("Employee name and bag count required");
    return;
  }

  localStorage.setItem("macyProdPrecleanDone", "YES");
  localStorage.setItem("macyProdPrecleanTimestamp", Date.now());

  alert("✅ Pre-cleaning submitted");

  window.location.href = "macy-production-control.html";
}

window.onload = checkPrecleanLock;
</script>

</body>
</html>
