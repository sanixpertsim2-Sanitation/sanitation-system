<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MACY – Production Pre-Cleaning</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="css/style.css">

<style>
.section {
  background: rgba(255,255,255,0.07);
  border-radius: 18px;
  padding: 22px;
  margin-bottom: 25px;
  box-shadow: 0 0 25px rgba(0,150,255,.25);
}

.section h3 {
  color: #7fd6ff;
  margin-bottom: 15px;
}

.question {
  margin-bottom: 18px;
}

select, input, textarea {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  border: none;
  margin-top: 6px;
}

textarea {
  min-height: 60px;
}

.hidden {
  display: none;
}

.submit-btn {
  width: 100%;
  padding: 16px;
  font-size: 18px;
  background: linear-gradient(135deg,#00b3ff,#0066ff);
  border: none;
  border-radius: 16px;
  color: white;
  cursor: pointer;
  box-shadow: 0 0 25px rgba(0,140,255,.7);
}
</style>
</head>

<body>

<div class="container">

<h1 class="page-title">MACY – Production</h1>
<h3>Pre-Cleaning Verification</h3>

<!-- GENERAL INFO -->
<div class="section">
  <h3>General Information</h3>

  <label>Employee Name *</label>
  <input type="text" id="employeeName">

  <label>Date & Time</label>
  <input type="text" id="dateTime" readonly>

  <label>Number of bags used *</label>
  <input type="number" id="bagsUsed">
</div>

<!-- CHECKLIST -->
<div class="section">
  <h3>Production Area Checklist</h3>

  <div class="question">
    No product residue present
    <select onchange="toggleExtra(this)">
      <option value="">Select</option>
      <option value="Acceptable">Acceptable</option>
      <option value="Not Acceptable">Not Acceptable</option>
      <option value="NA">N/A</option>
    </select>
    <div class="extra hidden">
      <input type="file" accept="image/*" capture="environment">
      <textarea placeholder="Comment required..."></textarea>
    </div>
  </div>

  <div class="question">
    Conveyor belts accessible
    <select onchange="toggleExtra(this)">
      <option value="">Select</option>
      <option value="Acceptable">Acceptable</option>
      <option value="Not Acceptable">Not Acceptable</option>
      <option value="NA">N/A</option>
    </select>
    <div class="extra hidden">
      <input type="file" accept="image/*" capture="environment">
      <textarea placeholder="Comment required..."></textarea>
    </div>
  </div>

</div>

<button class="submit-btn" onclick="submitPreCleaning()">
  Submit Pre-Cleaning
</button>

</div>

<!-- 🔒 LOCK OVERLAY -->
<div id="precleanLockOverlay"
     style="
       display:none;
       position:fixed;
       inset:0;
       background:rgba(15,23,42,.92);
       z-index:9999;
       color:white;
       text-align:center;
       padding:30px;
       display:flex;
       flex-direction:column;
       justify-content:center;
       align-items:center">

  <h1>🔒 Pre-Cleaning Submitted</h1>

  <p id="lockTime" style="opacity:.85"></p>

  <p style="opacity:.6">
    Checklist locked to prevent changes.
  </p>

  <button
    onclick="adminUnlock()"
    style="
      margin-top:30px;
      padding:12px 30px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.3);
      background:transparent;
      color:rgba(255,255,255,.7);
      font-size:14px;
      cursor:pointer;">
    Admin Unlock
  </button>

  <p style="font-size:12px;opacity:.4;margin-top:12px">
    Supervisor authorization required
  </p>
</div>

<script>
const ADMIN_PIN = "0735";

/* AUTO DATE */
document.getElementById("dateTime").value =
  new Date().toLocaleString();

/* TOGGLE EXTRA */
function toggleExtra(select) {
  const extra = select.parentElement.querySelector(".extra");
  if (select.value === "Not Acceptable" || select.value === "NA") {
    extra.classList.remove("hidden");
  } else {
    extra.classList.add("hidden");
  }
}

/* LOAD LOCK STATE */
document.addEventListener("DOMContentLoaded", () => {

  const done = localStorage.getItem("macyProdPrecleanDone");
  const time = localStorage.getItem("macyProdPrecleanTimestamp");

  if (done === "YES" && time) {

    document.getElementById("precleanLockOverlay").style.display = "flex";

    document.getElementById("lockTime").innerHTML =
      "Submitted at:<br><b>" +
      new Date(Number(time)).toLocaleString() +
      "</b>";

    const btn = document.querySelector(".submit-btn");
    btn.disabled = true;
    btn.style.opacity = "0.4";
  }
});

/* ADMIN UNLOCK */
function adminUnlock() {

  const pin = prompt("🔐 Supervisor Unlock");

  if (pin === ADMIN_PIN) {

    document.getElementById("precleanLockOverlay").style.display = "none";

    const btn = document.querySelector(".submit-btn");
    btn.disabled = false;
    btn.style.opacity = "1";

    alert("✅ Pre-clean unlocked");

  } else {
    alert("❌ Incorrect PIN");
  }
}

/* SUBMIT */
function submitPreCleaning() {

  const emp = document.getElementById("employeeName").value.trim();
  const bags = document.getElementById("bagsUsed").value.trim();

  if (!emp || !bags) {
    alert("Employee name and bag count required.");
    return;
  }

  localStorage.setItem("macyProdPrecleanDone", "YES");
  localStorage.setItem("macyProdPrecleanTimestamp", Date.now());

  alert("✅ Pre-Cleaning Submitted");

  location.reload(); // refresh to apply lock
}
</script>

</body>
</html>
