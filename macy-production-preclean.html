<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MACY – Production Pre-Cleaning</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="css/style.css">

<style>
.section {
  background: rgba(255,255,255,0.07);
  border-radius: 18px;
  padding: 22px;
  margin-bottom: 25px;
}

.question { margin-bottom: 18px; }

select, input, textarea {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  border: none;
  margin-top: 6px;
}

textarea { min-height: 60px; }

.hidden { display:none; }

.submit-btn {
  width:100%;
  padding:18px;
  font-size:18px;
  border:none;
  border-radius:16px;
  background:linear-gradient(135deg,#00b3ff,#0066ff);
  color:white;
}
</style>
</head>

<body>

<div class="container">

<h1 class="page-title">MACY – Production</h1>
<h3>Pre-Cleaning Verification</h3>

<!-- GENERAL INFO -->
<div class="section">
  <label>Employee Name *</label>
  <input id="employeeName">

  <label>Date & Time</label>
  <input id="dateTime" readonly>

  <label>Number of bags used *</label>
  <input type="number" id="bagsUsed">
</div>

<!-- QUESTIONS -->
<div class="section">

  <div class="question">
    No product residue present
    <select onchange="toggle(this)">
      <option value="">Select</option>
      <option>Acceptable</option>
      <option>Not Acceptable</option>
      <option>N/A</option>
    </select>
    <div class="extra hidden">
      <input type="file" capture="environment">
      <textarea placeholder="Comment"></textarea>
    </div>
  </div>

  <div class="question">
    Guards removed
    <select onchange="toggle(this)">
      <option value="">Select</option>
      <option>Acceptable</option>
      <option>Not Acceptable</option>
      <option>N/A</option>
    </select>
    <div class="extra hidden">
      <input type="file" capture="environment">
      <textarea placeholder="Comment"></textarea>
    </div>
  </div>

</div>

<button class="submit-btn" onclick="submitPreclean()">
  Submit Pre-Cleaning
</button>

</div>

<script>
/* AUTO TIME */
document.getElementById("dateTime").value =
  new Date().toLocaleString();

/* LOAD SAVED DATA */
const saved = JSON.parse(
  localStorage.getItem("macyPrecleanDraft") || "{}"
);

if (saved.employeeName)
  document.getElementById("employeeName").value = saved.employeeName;

if (saved.bagsUsed)
  document.getElementById("bagsUsed").value = saved.bagsUsed;

/* AUTO SAVE */
document.querySelectorAll("input, textarea, select")
.forEach(el => {
  el.addEventListener("input", saveDraft);
});

function saveDraft() {

  const data = {
    employeeName: document.getElementById("employeeName").value,
    bagsUsed: document.getElementById("bagsUsed").value
  };

  localStorage.setItem("macyPrecleanDraft", JSON.stringify(data));
}

/* TOGGLE */
function toggle(sel) {
  const extra = sel.parentElement.querySelector(".extra");
  if (sel.value !== "Acceptable") {
    extra.classList.remove("hidden");
  } else {
    extra.classList.add("hidden");
  }
}

/* SUBMIT */
function submitPreclean() {

  const name = document.getElementById("employeeName").value.trim();
  const bags = document.getElementById("bagsUsed").value.trim();

  if (!name || !bags) {
    alert("Employee name and bags required");
    return;
  }

  localStorage.setItem("macyPrecleanDone","YES");
  localStorage.setItem("macyPrecleanData",
    localStorage.getItem("macyPrecleanDraft"));

  alert("✅ Pre-cleaning submitted");

  window.location.href = "control.html";
}
</script>

</body>
</html>
