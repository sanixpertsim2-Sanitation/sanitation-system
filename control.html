<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MACY – Production Control</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="css/style.css">

<style>
.status {
  padding: 22px;
  border-radius: 18px;
  margin-bottom: 25px;
  text-align: center;
  font-size: 17px;
  font-weight: bold;
}

.blue   { background:#1e3a8a; }
.yellow { background:#92400e; }
.orange { background:#9a3412; }
.green  { background:#065f46; }

.action-btn {
  width: 100%;
  padding: 16px;
  font-size: 17px;
  border-radius: 16px;
  border: none;
  margin-top: 15px;
  background: linear-gradient(135deg,#00aaff,#0066ff);
  color: white;
  cursor: pointer;
}

.note {
  margin-top: 10px;
  font-size: 13px;
  opacity: .65;
}
</style>
</head>

<body>

<div class="container">

<h1 class="page-title">MACY – Production Line</h1>
<h3>Sanitation Control Panel</h3>

<div id="statusBox"></div>
<div id="actionBox"></div>

</div>

<!-- 🔐 Hidden Admin Override Area -->
<div id="adminOverrideZone"
     style="
       position:fixed;
       bottom:0;
       right:0;
       width:70px;
       height:70px;
       opacity:0;
       z-index:9999;">
</div>

<script>
/* ===================================================
   CONFIG
=================================================== */
const ADMIN_PIN = "0735";
const RESET_HOURS = 48;

/* ===================================================
   NAVIGATION
=================================================== */
function goPre()     { location.href = "macy-production-preclean.html"; }
function goDamage()  { location.href = "damage.html"; }
function goPost()    { location.href = "postclean.html"; }
function goRelease() { location.href = "macy-production-release.html"; }

/* ===================================================
   48 HOUR AUTO RESET
=================================================== */
(function autoReset() {

  const ts = localStorage.getItem("macyProdPrecleanTimestamp");
  if (!ts) return;

  const diff =
    (Date.now() - Number(ts)) / (1000 * 60 * 60);

  if (diff >= RESET_HOURS) {

    localStorage.removeItem("macyProdPrecleanDone");
    localStorage.removeItem("macyProdPostcleanDone");
    localStorage.removeItem("macyProdReleased");
    localStorage.removeItem("macyProdPrecleanEmployee");
    localStorage.removeItem("macyProdPrecleanBagsUsed");
    localStorage.removeItem("macyProdPostcleanTime");
    localStorage.removeItem("macyPrecleanInProgressBy");

    console.log("🔄 48-hour sanitation reset completed");
  }
})();

/* ===================================================
   CONTROL PANEL LOGIC
=================================================== */
function renderControl() {

  const pre  = localStorage.getItem("macyProdPrecleanDone");
  const post = localStorage.getItem("macyProdPostcleanDone");
  const rel  = localStorage.getItem("macyProdReleased");

  const status = document.getElementById("statusBox");
  const action = document.getElementById("actionBox");

  status.innerHTML = "";
  action.innerHTML = "";

  /* 🟢 RELEASED */
  if (rel === "YES") {
    status.innerHTML = `
      <div class="status green">
        🟢 LINE RELEASED FOR PRODUCTION
      </div>`;
    return;
  }

  /* 🟠 POST CLEAN DONE */
  if (post === "YES") {
    status.innerHTML = `
      <div class="status orange">
        🟠 Post-cleaning completed
      </div>`;
    action.innerHTML = `
      <button class="action-btn" onclick="goRelease()">
        Area Lead Verification
      </button>
      <div class="note">
        Verify sanitation before starting production
      </div>`;
    return;
  }

  /* 🟡 PRE CLEAN DONE */
  if (pre === "YES") {
    status.innerHTML = `
      <div class="status yellow">
        🟡 Pre-cleaning completed
      </div>`;
    action.innerHTML = `
      <button class="action-btn" onclick="goDamage()">
        Damage Report
      </button>

      <button class="action-btn" onclick="goPost()">
        Start Post-Cleaning
      </button>
      <div class="note">
        All damages must be reviewed before post-clean
      </div>`;
    return;
  }

  /* 🔵 NOT STARTED */
  status.innerHTML = `
    <div class="status blue">
      🔵 Sanitation not started
    </div>`;

  action.innerHTML = `
    <button class="action-btn" onclick="goPre()">
      Start Pre-Cleaning
    </button>
    <div class="note">
      Begin sanitation process for this production line
    </div>`;
}

/* ===================================================
   ADMIN OVERRIDE (5 TAP CORNER)
=================================================== */
let adminTap = 0;
let adminTimer = null;

document.getElementById("adminOverrideZone")
  .addEventListener("click", () => {

    adminTap++;

    if (adminTap === 1) {
      adminTimer = setTimeout(() => {
        adminTap = 0;
      }, 2000);
    }

    if (adminTap >= 5) {

      clearTimeout(adminTimer);
      adminTap = 0;

      const pin = prompt(
        "🔐 Supervisor Override\n\nEnter Admin PIN"
      );

      if (pin === ADMIN_PIN) {

        localStorage.clear();

        alert("✅ Sanitation system fully reset");

        location.reload();

      } else {
        alert("❌ Incorrect PIN");
      }
    }
});

/* ===================================================
   START
=================================================== */
renderControl();
</script>

</body>
</html>
