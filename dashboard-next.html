<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sanitation Dashboard</title>
  
  <!-- Mobile-Next Framework -->
  <link rel="stylesheet" href="css/mobile-next.css">
  
  <!-- Essential scripts only -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/mobile-next.js"></script>
</head>
<body>

<div class="app-container">
  <!-- Fixed Header -->
  <header class="app-header">
    <div class="text-title">Sanitation Dashboard</div>
    <div class="text-subtitle">Real-time Line Status</div>
  </header>

  <!-- Scrollable Content -->
  <main class="app-content">
    <!-- Quick Stats -->
    <div class="card fade-in">
      <div class="text-section">Today's Overview</div>
      
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;">
        <div style="text-align: center; padding: 16px; background: rgba(34, 197, 94, 0.1); border-radius: 12px;">
          <div class="text-body" style="font-size: 24px; font-weight: 700; color: #22c55e;" id="completedCount">0</div>
          <div class="text-small">Completed</div>
        </div>
        <div style="text-align: center; padding: 16px; background: rgba(251, 191, 36, 0.1); border-radius: 12px;">
          <div class="text-body" style="font-size: 24px; font-weight: 700; color: #fbbf24;" id="pendingCount">0</div>
          <div class="text-small">Pending</div>
        </div>
      </div>
      
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
        <div style="text-align: center; padding: 16px; background: rgba(239, 68, 68, 0.1); border-radius: 12px;">
          <div class="text-body" style="font-size: 24px; font-weight: 700; color: #ef4444;" id="damageCount">0</div>
          <div class="text-small">Open Damages</div>
        </div>
        <div style="text-align: center; padding: 16px; background: rgba(59, 130, 246, 0.1); border-radius: 12px;">
          <div class="text-body" style="font-size: 24px; font-weight: 700; color: #3b82f6;" id="handoverCount">0</div>
          <div class="text-small">Handovers</div>
        </div>
      </div>
    </div>

    <!-- Line Status -->
    <div class="card fade-in">
      <div class="text-section">Line Status</div>
      <div id="lineStatus"></div>
    </div>

    <!-- Recent Activities -->
    <div class="card fade-in">
      <div class="text-section">Recent Activities</div>
      <div id="recentActivities"></div>
    </div>

    <!-- Open Damages -->
    <div class="card fade-in">
      <div class="text-section">Open Damage Reports</div>
      <div id="openDamages"></div>
    </div>

    <!-- Pending Handovers -->
    <div class="card fade-in">
      <div class="text-section">Pending Handovers</div>
      <div id="pendingHandovers"></div>
    </div>
  </main>

  <!-- Sticky Bottom Actions -->
  <div class="sticky-actions">
    <button class="btn btn-primary btn-block" onclick="refreshDashboard()">
      <span>Refresh Dashboard</span>
    </button>
    <button class="btn btn-secondary btn-block" onclick="exportReport()">
      <span>Export Report</span>
    </button>
  </div>
</div>

<script>
// Initialize MobileNext framework
const mobileNext = window.MobileNext;
const supabase = window.supabaseClient;

// Dashboard data
let dashboardData = {
  stats: {},
  lineStatus: [],
  activities: [],
  damages: [],
  handovers: []
};

// Load dashboard data
async function loadDashboard() {
  try {
    mobileNext.showLoading('Loading dashboard...');
    
    // Load data in parallel
    const [preCleanData, postCleanData, damageData, handoverData, releaseData] = await Promise.all([
      loadPreCleanStats(),
      loadPostCleanStats(),
      loadDamageStats(),
      loadHandoverStats(),
      loadReleaseStats()
    ]);
    
    // Update UI
    updateStats(preCleanData, postCleanData, damageData, handoverData);
    updateLineStatus(releaseData);
    updateRecentActivities(preCleanData, postCleanData, damageData);
    updateOpenDamages(damageData);
    updatePendingHandovers(handoverData);
    
  } catch (error) {
    console.error('Error loading dashboard:', error);
    mobileNext.showToast('Failed to load dashboard', 'error');
  } finally {
    mobileNext.hideLoading();
  }
}

// Load pre-cleaning stats
async function loadPreCleanStats() {
  const today = new Date().toISOString().split('T')[0];
  const { data, error } = await supabase
    .from('pre_cleaning_logs')
    .select('*')
    .gte('submitted_at', today)
    .order('submitted_at', { ascending: false });
  
  return error ? [] : data || [];
}

// Load post-cleaning stats
async function loadPostCleanStats() {
  const today = new Date().toISOString().split('T')[0];
  const { data, error } = await supabase
    .from('post_cleaning_logs')
    .select('*')
    .gte('submitted_at', today)
    .order('submitted_at', { ascending: false });
  
  return error ? [] : data || [];
}

// Load damage stats
async function loadDamageStats() {
  const { data, error } = await supabase
    .from('damage_reports')
    .select('*')
    .in('status', ['Open', 'Handover'])
    .order('created_at', { ascending: false })
    .limit(20);
  
  return error ? [] : data || [];
}

// Load handover stats
async function loadHandoverStats() {
  const { data, error } = await supabase
    .from('handover_tasks')
    .select('*')
    .eq('status', 'Pending')
    .order('created_at', { ascending: false })
    .limit(20);
  
  return error ? [] : data || [];
}

// Load release stats
async function loadReleaseStats() {
  const today = new Date().toISOString().split('T')[0];
  const { data, error } = await supabase
    .from('line_release_logs')
    .select('*')
    .gte('verified_at', today)
    .order('verified_at', { ascending: false });
  
  return error ? [] : data || [];
}

// Update stats
function updateStats(preCleanData, postCleanData, damageData, handoverData) {
  const completed = preCleanData.length + postCleanData.length;
  const pending = handoverData.length;
  const damages = damageData.filter(d => d.status === 'Open').length;
  const handovers = damageData.filter(d => d.status === 'Handover').length;
  
  document.getElementById('completedCount').textContent = completed;
  document.getElementById('pendingCount').textContent = pending;
  document.getElementById('damageCount').textContent = damages;
  document.getElementById('handoverCount').textContent = handovers;
}

// Update line status
function updateLineStatus(releaseData) {
  const lineStatus = document.getElementById('lineStatus');
  lineStatus.innerHTML = '';
  
  const lines = [
    { name: 'MACY Production', area: 'MACY_PRODUCTION' },
    { name: 'MACY Decoration', area: 'MACY_DECORATION' },
    { name: 'MACY Spiral', area: 'MACY_Spiral' },
    { name: 'MACY Oven', area: 'MACY_Oven' },
    { name: 'MACY Palletizer', area: 'MACY_Palletizer' }
  ];
  
  lines.forEach(line => {
    const lineCard = document.createElement('div');
    lineCard.className = 'card mb-2';
    
    const todayReleases = releaseData.filter(r => 
      new Date(r.verified_at).toDateString() === new Date().toDateString()
    );
    
    const isReleased = todayReleases.length > 0;
    const lastRelease = todayReleases[0];
    
    lineCard.innerHTML = `
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div>
          <div class="text-body" style="font-weight: 600;">${line.name}</div>
          <div class="text-small" style="color: #94a3b8;">
            ${isReleased ? 'Released' : 'Pending'}
          </div>
        </div>
        <div style="text-align: right;">
          <span class="status ${isReleased ? 'status-completed' : 'status-pending'}">
            ${isReleased ? 'Released' : 'Pending'}
          </span>
          ${lastRelease ? `
            <div class="text-small" style="color: #64748b; margin-top: 4px;">
              ${new Date(lastRelease.verified_at).toLocaleTimeString()}
            </div>
          ` : ''}
        </div>
      </div>
    `;
    
    lineStatus.appendChild(lineCard);
  });
}

// Update recent activities
function updateRecentActivities(preCleanData, postCleanData, damageData) {
  const activities = document.getElementById('recentActivities');
  activities.innerHTML = '';
  
  // Combine and sort activities
  const allActivities = [
    ...preCleanData.map(item => ({
      type: 'pre-clean',
      area: item.area,
      employee: item.employee_name,
      time: item.submitted_at,
      description: 'Pre-cleaning completed'
    })),
    ...postCleanData.map(item => ({
      type: 'post-clean',
      area: item.area,
      employee: item.employee_name,
      time: item.submitted_at,
      description: 'Post-cleaning completed'
    })),
    ...damageData.slice(0, 5).map(item => ({
      type: 'damage',
      area: item.area,
      employee: item.reporter,
      time: item.created_at,
      description: `Damage reported: ${item.component}`
    }))
  ].sort((a, b) => new Date(b.time) - new Date(a.time))
   .slice(0, 10);
  
  if (allActivities.length === 0) {
    activities.innerHTML = '<p class="text-body text-center">No recent activities</p>';
    return;
  }
  
  allActivities.forEach(activity => {
    const activityCard = document.createElement('div');
    activityCard.className = 'mb-3';
    
    const typeColor = activity.type === 'pre-clean' ? '#22c55e' : 
                      activity.type === 'post-clean' ? '#3b82f6' : 
                      '#ef4444';
    
    activityCard.innerHTML = `
      <div style="display: flex; align-items: start; gap: 12px;">
        <div style="
          width: 8px;
          height: 8px;
          background: ${typeColor};
          border-radius: 50%;
          margin-top: 6px;
          flex-shrink: 0;
        "></div>
        <div style="flex: 1;">
          <div class="text-body" style="font-weight: 500;">${activity.description}</div>
          <div class="text-small" style="color: #94a3b8;">
            ${activity.area} • ${activity.employee} • ${new Date(activity.time).toLocaleTimeString()}
          </div>
        </div>
      </div>
    `;
    
    activities.appendChild(activityCard);
  });
}

// Update open damages
function updateOpenDamages(damageData) {
  const openDamages = document.getElementById('openDamages');
  openDamages.innerHTML = '';
  
  const openDamageList = damageData.filter(d => d.status === 'Open').slice(0, 5);
  
  if (openDamageList.length === 0) {
    openDamages.innerHTML = '<p class="text-body text-center">No open damages</p>';
    return;
  }
  
  openDamageList.forEach(damage => {
    const damageCard = document.createElement('div');
    damageCard.className = 'card mb-2';
    
    const severityColor = damage.severity === 'High' ? '#ef4444' : 
                         damage.severity === 'Medium' ? '#f59e0b' : 
                         '#22c55e';
    
    damageCard.innerHTML = `
      <div style="display: flex; justify-content: space-between; align-items: start;">
        <div style="flex: 1;">
          <div class="text-body" style="font-weight: 600;">${damage.component}</div>
          <div class="text-small" style="color: #94a3b8;">${damage.area}</div>
          <div class="text-body" style="margin: 8px 0;">${damage.description}</div>
        </div>
        <div style="text-align: right;">
          <div class="text-small" style="color: ${severityColor}; font-weight: 600;">${damage.severity}</div>
          <div class="text-small" style="color: #64748b;">
            ${new Date(damage.created_at).toLocaleDateString()}
          </div>
        </div>
      </div>
    `;
    
    openDamages.appendChild(damageCard);
  });
}

// Update pending handovers
function updatePendingHandovers(handoverData) {
  const pendingHandovers = document.getElementById('pendingHandovers');
  pendingHandovers.innerHTML = '';
  
  if (handoverData.length === 0) {
    pendingHandovers.innerHTML = '<p class="text-body text-center">No pending handovers</p>';
    return;
  }
  
  handoverData.slice(0, 5).forEach(handover => {
    const handoverCard = document.createElement('div');
    handoverCard.className = 'card mb-2';
    
    handoverCard.innerHTML = `
      <div style="display: flex; justify-content: space-between; align-items: start;">
        <div style="flex: 1;">
          <div class="text-body" style="font-weight: 600;">${handover.task_description}</div>
          <div class="text-small" style="color: #94a3b8;">${handover.area || 'Unknown Area'}</div>
          <div class="text-small" style="color: #64748b;">
            Source: ${handover.source}
          </div>
        </div>
        <div style="text-align: right;">
          <span class="status status-pending">Pending</span>
          <div class="text-small" style="color: #64748b; margin-top: 4px;">
            ${new Date(handover.created_at).toLocaleDateString()}
          </div>
        </div>
      </div>
    `;
    
    pendingHandovers.appendChild(handoverCard);
  });
}

// Refresh dashboard
function refreshDashboard() {
  loadDashboard();
  mobileNext.showToast('Dashboard refreshed', 'success');
}

// Export report
function exportReport() {
  mobileNext.showToast('Export feature coming soon', 'info');
}

// Auto-refresh every 30 seconds
setInterval(() => {
  loadDashboard();
}, 30000);

// Initialize page
document.addEventListener('DOMContentLoaded', function() {
  loadDashboard();
  console.log('🚀 Dashboard loaded');
});
</script>

</body>
</html>
