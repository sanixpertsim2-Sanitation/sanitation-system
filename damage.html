<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MACY – Damage Report</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="css/style.css">

<style>
.section {
  background: rgba(255,80,80,.08);
  border-radius:18px;
  padding:22px;
  margin-bottom:25px;
}
.card {
  background:#0f172a;
  border-radius:14px;
  padding:15px;
  margin-bottom:15px;
  border-left:6px solid;
}
.critical { border-color:#ff3b3b; }
.moderate { border-color:#facc15; }
.minor { border-color:#22c55e; }
.small { font-size:12px; color:#94a3b8; }
.btn {
  padding:8px 14px;
  border:none;
  border-radius:10px;
  margin-top:10px;
  cursor:pointer;
}
.resolve { background:#22c55e; color:black; }
</style>
</head>

<body>

<div class="container">

<h1 class="page-title">MACY – Damage Report</h1>

<!-- NEW DAMAGE -->
<div class="section">
  <h3>Report New Damage</h3>

  <input id="lineArea" placeholder="Line" readonly>
  <input id="reportedBy" placeholder="Reported by (Name)">
  <input id="area" placeholder="Component / Location (e.g., Conveyor / Frame)">
  <input id="reportedAt" placeholder="Date & Time" readonly>
  <textarea id="desc" placeholder="Describe the issue"></textarea>

  <select id="severity">
    <option value="">Select severity</option>
    <option value="High">🔴 High</option>
    <option value="Medium">🟡 Medium</option>
    <option value="Low">🟢 Low</option>
  </select>

  
  <label class="upload-btn">
  📷 Capture Damage Photo
  <input type="file" accept="image/*" capture="environment"
         onchange="handleDamagePhoto(this)" hidden>
</label>

<img id="preview" style="width:100%;border-radius:12px;display:none;margin-top:10px">
<p class="small" id="photoTime"></p>


  <button class="btn resolve sticky-cta" onclick="submitDamage()">Submit Damage</button>
</div>

<!-- LIST -->
<div class="section">
  <h3>Damage List</h3>
  <div id="damageList"></div>
</div>
<div style="max-height:300px;overflow-y:auto">
  <table style="width:100%;color:white;font-size:14px">
    <thead>
      <tr>
        <th>Area</th>
        <th>Severity</th>
        <th>Status</th>
        <th>Time</th>
      </tr>
    </thead>
    <tbody id="damageTable"></tbody>
  </table>
</div>
</div>
  
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/photoUtils.js"></script>
<script>
let damagePhotoBase64 = "";
const supabase = window.supabaseClient;

function updateDamageButton() {
  const btn = document.querySelector("button[onclick='submitDamage()']");
  if (!btn) return;
  const reporterVal = document.getElementById("reportedBy").value.trim();
  const areaVal = document.getElementById("area").value.trim();
  const descVal = document.getElementById("desc").value.trim();
  const sevVal = document.getElementById("severity").value;
  btn.disabled = !(reporterVal && areaVal && descVal && sevVal && damagePhotoBase64);
}

/* ======================
   PHOTO HANDLER
====================== */
function handleDamagePhoto(input) {
  const file = input.files[0];
  if (!file) return;
  readAndStampImage(file).then(stamped => {
    damagePhotoBase64 = stamped;
    document.getElementById("preview").src = stamped;
    document.getElementById("preview").style.display = "block";
    document.getElementById("photoTime").innerText =
      "🕒 " + new Date().toLocaleString();
    updateDamageButton();
  });
}

/* ======================
   STORAGE HELPERS
====================== */
function toStoredDescription(text, photo, component, reporter, reportedAt) {
  return JSON.stringify({
    text: text,
    photo: photo || "",
    component: component || "",
    reporter: reporter || "",
    reported_at: reportedAt || ""
  });
}

function fromStoredDescription(stored) {
  try {
    const parsed = JSON.parse(stored);
    if (parsed && typeof parsed === "object" && "text" in parsed) {
      return parsed;
    }
  } catch (e) {
    // keep fallback
  }
  return { text: stored || "", photo: "", component: "", reporter: "", reported_at: "" };
}

async function getDamages() {
  if (!supabase) return [];
  const area = localStorage.getItem("selectedArea") || "MACY_PRODUCTION";
  const { data, error } = await supabase
    .from("damage_reports")
    .select("*")
    .eq("area", area)
    .order("created_at", { ascending: false });
  if (error) {
    alert("Failed to load damages: " + (error.message || "Unknown error"));
    return [];
  }
  return data || [];
}

function statusClass(status) {
  if (status === "Completed" || status === "Closed") return "status-success";
  if (status === "Handover") return "status-pending";
  return "status-warning";
}
async function saveDamageUpdate(id, patch) {
  if (!supabase) return;
  const { error } = await supabase
    .from("damage_reports")
    .update(patch)
    .eq("id", id);
  if (error) {
    alert("Failed to update damage: " + (error.message || "Unknown error"));
  }
}

/* ======================
   SUBMIT DAMAGE
====================== */
async function submitDamage() {

  const reporterVal = document.getElementById("reportedBy").value.trim();
  const componentVal = document.getElementById("area").value.trim();
  const descVal = document.getElementById("desc").value.trim();
  const sevVal = document.getElementById("severity").value;
  const lineArea = localStorage.getItem("selectedArea") || "MACY_PRODUCTION";

  if (!reporterVal || !componentVal || !descVal || !sevVal || !damagePhotoBase64) {
    alert("All fields and photo are required");
    return;
  }

  if (!supabase) {
    alert("Supabase client not loaded.");
    return;
  }

  const reportedAt = new Date().toISOString();
  const storedDescription = toStoredDescription(descVal, damagePhotoBase64, componentVal, reporterVal, reportedAt);

  const { error } = await supabase
    .from("damage_reports")
    .insert({
      area: lineArea,
      description: storedDescription,
      severity: sevVal,
      status: "Open",
      created_at: reportedAt
    });

  if (error) {
    alert("Failed to submit damage: " + (error.message || "Unknown error"));
    return;
  }

  alert("✅ Damage submitted");

  // Optional webhook for high severity alerts.
  if (sevVal === "High") {
    sendDamageAlert({
      area: lineArea,
      component: componentVal,
      severity: sevVal,
      reporter: reporterVal
    });
  }

  history.back();
}

function sendDamageAlert(payload) {
  const webhook = window.__ENV && window.__ENV.DAMAGE_ALERT_WEBHOOK;
  if (!webhook) return;
  fetch(webhook, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  }).catch(() => {});
}

/* ======================
   RENDER LIST
====================== */
function renderList() {

  const list = document.getElementById("damageList");
  list.innerHTML = "";

  getDamages().then(damages => {
    damages.forEach(d => {

      const parsed = fromStoredDescription(d.description);
      const displayText = parsed.text || d.description || "";
      const componentText = parsed.component ? ` (${parsed.component})` : "";
      const reporterText = parsed.reporter ? ` • ${parsed.reporter}` : "";
      const reportedAtText = parsed.reported_at ? new Date(parsed.reported_at).toLocaleString() : "";
      const div = document.createElement("div");
      div.className = "card " + (d.severity || "").toLowerCase();

      let actionHTML = "";

      if (d.status === "Open") {
        actionHTML = `
          <button class="btn resolve" onclick="markCompleted('${d.id}')">✅ Completed</button>
          <button class="btn" onclick="markHandover('${d.id}')">🔁 Handover</button>
        `;
      } else {
        actionHTML = `<div class="small">Status: ${d.status}</div>`;
      }

      div.innerHTML = `
        <b>${d.area}</b>${componentText} — ${d.severity || "-"}<br>
        ${displayText}<br>
        <span class="small">Reported: ${reportedAtText}${reporterText}</span><br>
        <span class="status-badge ${statusClass(d.status)}">${d.status}</span><br>
        ${actionHTML}
      `;

      list.appendChild(div);
    });
  });

  renderDamageTable();
}

/* ======================
   COMPLETED
====================== */
async function markCompleted(id) {

  const who = prompt(
    "Completed by:\nMaintenance / Sanitation / Production / Contractor"
  );

  if (!who) return;

  const fileInput = document.createElement("input");
  fileInput.type = "file";
  fileInput.accept = "image/*";
  fileInput.capture = "environment";
  fileInput.onchange = async () => {
    if (!fileInput.files.length) {
      alert("Completion photo required.");
      return;
    }
    const photo = await readAndStampImage(fileInput.files[0]);
    if (!photo) {
      alert("Completion photo required.");
      return;
    }
    await saveDamageUpdate(id, {
      status: "Closed",
      completed_by: who,
      completed_photo: photo,
      completed_at: new Date().toISOString()
    });
    renderList();
  };
  fileInput.click();
}

/* ======================
   HANDOVER
====================== */
async function markHandover(id) {

  const note = prompt(
    "Handover reason:\n" +
    "• Not fixed yet\n" +
    "• Partially fixed\n" +
    "• Maintenance next shift"
  );

  if (!note) return;

  const fileInput = document.createElement("input");
  fileInput.type = "file";
  fileInput.accept = "image/*";
  fileInput.capture = "environment";
  fileInput.onchange = async () => {
    if (!fileInput.files.length) {
      alert("Handover photo required.");
      return;
    }
    const stamped = await readAndStampImage(fileInput.files[0]);
    // Store handover evidence in completed_photo (no dedicated column in schema).
    await saveDamageUpdate(id, {
      status: "Handover",
      handover_reason: note,
      completed_photo: stamped || "",
      handover_at: new Date().toISOString()
    });
    renderList();
  };
  fileInput.click();
}

/* ======================
   TABLE
====================== */
function renderDamageTable() {

  const table = document.getElementById("damageTable");
  table.innerHTML = "";

  getDamages().then(damages => {
    damages.forEach(d => {
      table.innerHTML += `
        <tr>
          <td>${d.area}</td>
          <td>${d.severity || "-"}</td>
          <td>${d.status}</td>
          <td>${new Date(d.created_at).toLocaleString()}</td>
        </tr>
      `;
    });
  });
}

// Ensure selected line is applied to damage records.
localStorage.setItem("selectedLine", localStorage.getItem("selectedArea") || "MACY_PRODUCTION");
document.getElementById("lineArea").value = localStorage.getItem("selectedArea") || "MACY_PRODUCTION";
document.getElementById("reportedAt").value = new Date().toLocaleString();
renderList();
document.getElementById("reportedBy").addEventListener("input", updateDamageButton);
document.getElementById("area").addEventListener("input", updateDamageButton);
document.getElementById("desc").addEventListener("input", updateDamageButton);
document.getElementById("severity").addEventListener("change", updateDamageButton);
updateDamageButton();
</script>
<script src="js/layout.js"></script>

</body>
</html>
