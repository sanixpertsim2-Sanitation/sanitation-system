<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MACY – Damage Report</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="css/style.css">

<style>
.section {
  background: rgba(255,80,80,.08);
  border-radius:18px;
  padding:22px;
  margin-bottom:25px;
}
.card {
  background:#0f172a;
  border-radius:14px;
  padding:15px;
  margin-bottom:15px;
  border-left:6px solid;
}
.critical { border-color:#ff3b3b; }
.moderate { border-color:#facc15; }
.minor { border-color:#22c55e; }
.small { font-size:12px; color:#94a3b8; }
.btn {
  padding:8px 14px;
  border:none;
  border-radius:10px;
  margin-top:10px;
  cursor:pointer;
}
.resolve { background:#22c55e; color:black; }
</style>
</head>

<body>

<div class="container">

<h1 class="page-title">MACY – Damage Report</h1>

<!-- NEW DAMAGE -->
<div class="section">
  <h3>Report New Damage</h3>

  <input id="area" placeholder="Area (Conveyor / Frame / Guard)">
  <textarea id="desc" placeholder="Describe the issue"></textarea>

  <select id="severity">
    <option value="">Select severity</option>
    <option value="Critical">🔴 Critical</option>
    <option value="Moderate">🟡 Moderate</option>
    <option value="Minor">🟢 Minor</option>
  </select>

  
  <label class="upload-btn">
  📷 Capture Damage Photo
  <input type="file" accept="image/*" capture="environment"
         onchange="handleDamagePhoto(this)" hidden>
</label>

<img id="preview" style="width:100%;border-radius:12px;display:none;margin-top:10px">
<p class="small" id="photoTime"></p>


  <button class="btn resolve" onclick="submitDamage()">Submit Damage</button>
</div>

<!-- LIST -->
<div class="section">
  <h3>Damage List</h3>
  <div id="damageList"></div>
</div>
<div style="max-height:300px;overflow-y:auto">
  <table style="width:100%;color:white;font-size:14px">
    <thead>
      <tr>
        <th>Area</th>
        <th>Severity</th>
        <th>Status</th>
        <th>Time</th>
      </tr>
    </thead>
    <tbody id="damageTable"></tbody>
  </table>
</div>
</div>
  
<script>
let damagePhotoBase64 = "";

/* ======================
   PHOTO HANDLER
====================== */
function handleDamagePhoto(input) {
  const file = input.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = () => {
    damagePhotoBase64 = reader.result;
    document.getElementById("preview").src = reader.result;
    document.getElementById("preview").style.display = "block";
    document.getElementById("photoTime").innerText =
      "🕒 " + new Date().toLocaleString();
  };
  reader.readAsDataURL(file);
}

/* ======================
   STORAGE HELPERS
====================== */
function getDamages() {
  return JSON.parse(localStorage.getItem("macyDamageReports") || "[]");
}

function saveDamages(list) {
  localStorage.setItem("macyDamageReports", JSON.stringify(list));
}

/* ======================
   SUBMIT DAMAGE
====================== */
function submitDamage() {

  const areaVal = document.getElementById("area").value.trim();
  const descVal = document.getElementById("desc").value.trim();
  const sevVal = document.getElementById("severity").value;

  if (!areaVal || !descVal || !sevVal || !damagePhotoBase64) {
    alert("All fields and photo are required");
    return;
  }

  const damages = getDamages();

  damages.push({
    id: "DR-" + Date.now(),
    area: areaVal,
    description: descVal,
    severity: sevVal,
    photo: damagePhotoBase64,
    reportedAt: new Date().toLocaleString(),
    status: "Open"
  });

  saveDamages(damages);

  alert("✅ Damage submitted");

  history.back();
}

/* ======================
   RENDER LIST
====================== */
function renderList() {

  const list = document.getElementById("damageList");
  const damages = getDamages();

  list.innerHTML = "";

  damages.forEach(d => {

    const div = document.createElement("div");
    div.className = "card " + d.severity.toLowerCase();

    let actionHTML = "";

    if (d.status === "Open") {
      actionHTML = `
        <button class="btn resolve" onclick="markCompleted('${d.id}')">✅ Completed</button>
        <button class="btn" onclick="markHandover('${d.id}')">🔁 Handover</button>
      `;
    } else {
      actionHTML = `<div class="small">Status: ${d.status}</div>`;
    }

    div.innerHTML = `
      <b>${d.area}</b> — ${d.severity}<br>
      ${d.description}<br>
      <span class="small">Reported: ${d.reportedAt}</span><br>
      ${actionHTML}
    `;

    list.appendChild(div);
  });

  renderDamageTable();
}

/* ======================
   COMPLETED
====================== */
function markCompleted(id) {

  const who = prompt("Who fixed it? (Maintenance / Sanitation / Name)");
  if (!who) return;

  const damages = getDamages();
  const d = damages.find(x => x.id === id);

  d.status = "Completed";
  d.completedBy = who;
  d.completedTime = new Date().toLocaleString();

  saveDamages(damages);
  renderList();
}

/* ======================
   HANDOVER
====================== */
function markHandover(id) {

  const note = prompt("Handover note (issue not fixed)");
  if (!note) return;

  const damages = getDamages();
  const d = damages.find(x => x.id === id);

  d.status = "Handover";
  d.handoverNotes = note;
  d.handoverTime = new Date().toLocaleString();

  saveDamages(damages);
  renderList();
}

/* ======================
   TABLE
====================== */
function renderDamageTable() {

  const table = document.getElementById("damageTable");
  const damages = getDamages();

  table.innerHTML = "";

  damages.forEach(d => {
    table.innerHTML += `
      <tr>
        <td>${d.area}</td>
        <td>${d.severity}</td>
        <td>${d.status}</td>
        <td>${d.reportedAt}</td>
      </tr>
    `;
  });
}

renderList();
</script>

</body>
</html>
