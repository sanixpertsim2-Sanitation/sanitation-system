<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MACY – Damage Report</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="css/style.css">

<style>
.section {
  background: rgba(255,80,80,.08);
  border-radius:18px;
  padding:22px;
  margin-bottom:25px;
}
.card {
  background:#0f172a;
  border-radius:14px;
  padding:15px;
  margin-bottom:15px;
  border-left:6px solid;
}
.critical { border-color:#ff3b3b; }
.moderate { border-color:#facc15; }
.minor { border-color:#22c55e; }
.small { font-size:12px; color:#94a3b8; }
.btn {
  padding:8px 14px;
  border:none;
  border-radius:10px;
  margin-top:10px;
  cursor:pointer;
}
.resolve { background:#22c55e; color:black; }
</style>
</head>

<body>

<div class="container">

<h1 class="page-title">MACY – Damage Report</h1>

<!-- NEW DAMAGE -->
<div class="section">
  <h3>Report New Damage</h3>

  <input id="area" placeholder="Area (Conveyor / Frame / Guard)">
  <textarea id="desc" placeholder="Describe the issue"></textarea>

  <select id="severity">
    <option value="">Select severity</option>
    <option value="Critical">🔴 Critical</option>
    <option value="Moderate">🟡 Moderate</option>
    <option value="Minor">🟢 Minor</option>
  </select>

  <input type="file"
         accept="image/*"
         capture="environment"
         onchange="stampPhoto(this)">

  <p class="small" id="photoTime"></p>

  <button class="btn resolve" onclick="submitDamage()">Submit Damage</button>
</div>

<!-- LIST -->
<div class="section">
  <h3>Damage List</h3>
  <div id="damageList"></div>
</div>

</div>

<script>

/* =========================
   PHOTO TIMESTAMP
========================= */
let photoTimestamp = "";

function stampPhoto() {
  photoTimestamp = new Date().toLocaleString();
  document.getElementById("photoTime").innerText =
    "🕒 Photo taken at: " + photoTimestamp;
}

/* =========================
   STORAGE HELPERS
========================= */
function getDamages() {
  return JSON.parse(localStorage.getItem("macyDamageReports") || "[]");
}

function saveDamages(list) {
  localStorage.setItem(
    "macyDamageReports",
    JSON.stringify(list)
  );
}

/* =========================
   SUBMIT DAMAGE
========================= */
function submitDamage() {

  const areaVal =
    document.getElementById("area").value.trim();

  const descVal =
    document.getElementById("desc").value.trim();

  const sevVal =
    document.getElementById("severity").value;

  if (!areaVal || !descVal || !sevVal || !photoTimestamp) {
    alert("All fields and photo are required");
    return;
  }

  const damages = getDamages();

  damages.push({
    id: "DR-" + Date.now(),
    area: areaVal,
    description: descVal,
    severity: sevVal,
    status: "Open",
    photoTime: photoTimestamp,
    createdAt: new Date().toLocaleString(),
    resolvedAt: null
  });

  saveDamages(damages);

  alert("✅ Damage recorded successfully");

  location.reload();
}

/* =========================
   RESOLVE DAMAGE
========================= */
function resolveDamage(id) {

  const damages = getDamages();

  const d = damages.find(x => x.id === id);

  if (d) {
    d.status = "Resolved";
    d.resolvedAt = new Date().toLocaleString();
    saveDamages(damages);
    renderList();
  }
}

/* =========================
   SORT + DISPLAY
========================= */
function renderList() {

  const list = document.getElementById("damageList");
  const damages = getDamages();

  const priority = {
    Critical: 1,
    Moderate: 2,
    Minor: 3
  };

  damages.sort((a, b) => {
    if (a.status !== b.status)
      return a.status === "Open" ? -1 : 1;

    return priority[a.severity] - priority[b.severity];
  });

  list.innerHTML = "";

  damages.forEach(d => {

    const div = document.createElement("div");
    div.className = `card ${d.severity.toLowerCase()}`;

    div.innerHTML = `
      <b>${d.area}</b> — ${d.severity}<br>
      ${d.description}<br>
      <span class="small">Reported: ${d.photoTime}</span><br>
      <span class="small">Status: ${d.status}</span>

      ${
        d.status === "Open"
          ? `<button class="btn resolve"
               onclick="resolveDamage('${d.id}')">
               Mark Resolved
             </button>`
          : `<div class="small">
               Resolved at: ${d.resolvedAt}
             </div>`
      }
    `;

    list.appendChild(div);
  });
}

renderList();

</script>

</body>
</html>
