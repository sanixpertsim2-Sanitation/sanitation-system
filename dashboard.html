<!DOCTYPE html>
<html>
<head>
<title>Sanitation Release Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css">

<style>
table {
  width:100%;
  border-collapse: collapse;
  margin-top:20px;
}

th, td {
  border-bottom:1px solid rgba(255,255,255,0.2);
  padding:12px;
  text-align:left;
}

th {
  background:#1e293b;
}

tr:hover {
  background:rgba(255,255,255,0.05);
}

.green {
  color:#22c55e;
  font-weight:600;
}
</style>
</head>

<body>

<div class="container">

<h1>Sanitation Release Dashboard</h1>
<h3>Today’s Line Releases</h3>

<table>
  <thead>
    <tr>
      <th>Line</th>
      <th>Status</th>
      <th>Area Lead</th>
      <th>Release Time</th>
    </tr>
  </thead>
  <tbody id="releaseTable"></tbody>
</table>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script>
const table = document.getElementById("releaseTable");
const supabase = window.supabaseClient;

const today = new Date().toLocaleDateString();

async function loadReleases() {
  if (!supabase) return;
  const { data, error } = await supabase
    .from("line_release_logs")
    .select("*")
    .order("verified_at", { ascending: false });
  if (error) {
    alert("Failed to load release history: " + (error.message || "Unknown error"));
    return;
  }

  (data || []).forEach(r => {
    const date = new Date(r.verified_at).toLocaleDateString();

    if (date === today) {
      const row = `
        <tr>
          <td>MACY – Cupcake Line</td>
          <td class="green">Released</td>
          <td>${r.released_by}</td>
          <td>${new Date(r.verified_at).toLocaleString()}</td>
        </tr>
      `;
      table.innerHTML += row;
    }
  });
}

loadReleases();
</script>

</body>
</html>
